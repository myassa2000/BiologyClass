<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>광합성과 세포호흡 인터랙티브 탐구</title>
<style>
:root{
  --paper:#FAF7F0;
  --card:#FFFFFF;
  --ink:#25231E;
  --ink2:#5E584D;
  --ink3:#918977;
  --rule:#E0D8C7;
  --rule2:#CFC5AE;

  --cyto:#E5EFD9;
  --cyto-line:#A9C88C;
  --mito:#F0E4D1;
  --mito-line:#CDAF83;
  --thyl:#CFE7C3;
  --thyl-line:#84B36F;

  --orange:#DE7A2C;
  --orange-soft:#F9DCC0;
  --orange-line:#C4661C;
  --blue:#3A7BC0;
  --blue-soft:#D3E3F4;
  --teal:#3AA294;
  --teal-soft:#D2ECE7;
  --purple:#9A7BC4;
  --purple-soft:#E6DCF4;
  --pink:#F5DCE6;
  --pink-line:#DCA3BE;
  --magenta:#BE3487;
  --red:#C0392B;

  --carbon:#4C4A54;
  --carbon-line:#2E2C34;
  --atp:#F5C41C;
  --atp-line:#C79807;
  --phos:#F0CB8C;
  --phos-line:#C79A50;

  --sans:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR","Nanum Gothic",sans-serif;
  --serif:"Times New Roman","Nanum Myeongjo",Batang,"Batang",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
/* ---------- header ---------- */
header{
  border-bottom:1px solid var(--rule2);
  background:var(--paper);
  position:sticky;top:0;z-index:40;
}
.hbar{
  max-width:1560px;margin:0 auto;padding:14px 22px 0;
  display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap;
}
.brand{display:flex;align-items:baseline;gap:10px;padding-bottom:12px}
.brand h1{
  font-size:19px;font-weight:800;letter-spacing:-.03em;
}
.brand span{font-size:12px;color:var(--ink3);letter-spacing:.06em}
.maintabs{display:flex;gap:6px;margin-left:auto;padding-bottom:0}
.maintabs button{
  font-family:inherit;font-size:15px;font-weight:700;letter-spacing:-.02em;
  border:1px solid var(--rule2);border-bottom:none;
  background:#F2ECE0;color:var(--ink2);
  padding:10px 24px;border-radius:9px 9px 0 0;cursor:pointer;
  position:relative;top:1px;transition:background .15s,color .15s;
}
.maintabs button:hover{background:#EAE2D2}
.maintabs button[aria-selected="true"]{
  background:var(--paper);color:var(--ink);
  box-shadow:0 -3px 0 0 var(--orange) inset;
  border-color:var(--rule2);
}
.subbar{
  border-top:1px solid var(--rule2);background:#F6F1E6;
}
.subtabs{
  max-width:1560px;margin:0 auto;padding:0 22px;
  display:flex;gap:2px;flex-wrap:wrap;
}
.subtabs button{
  font-family:inherit;font-size:13.5px;font-weight:600;
  border:none;background:none;color:var(--ink3);
  padding:11px 16px;cursor:pointer;border-bottom:3px solid transparent;
  letter-spacing:-.02em;transition:color .15s;
}
.subtabs button:hover{color:var(--ink2)}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--orange)}

/* ---------- layout ---------- */
main{
  max-width:1560px;margin:0 auto;padding:20px 22px 8px;
  display:grid;grid-template-columns:minmax(0,1fr) 348px;gap:20px;align-items:start;
}
.stage-col{min-width:0}
.stagehead{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.stagehead h2{font-size:17px;font-weight:800;letter-spacing:-.03em}
.stagehead p{font-size:12.5px;color:var(--ink3)}
.stage{
  background:var(--card);border:1px solid var(--rule);border-radius:12px;
  padding:8px;overflow:hidden;
}
.stage svg{display:block;width:100%;height:auto}

/* ---------- controls ---------- */
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.btn{
  font-family:inherit;font-size:13px;font-weight:700;letter-spacing:-.02em;
  border:1px solid var(--rule2);background:var(--card);color:var(--ink);
  padding:8px 14px;border-radius:7px;cursor:pointer;transition:.15s;
}
.btn:hover{background:#F4EFE4}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#3b3830}
.btn:disabled{opacity:.38;cursor:default}
.btn.warm[aria-pressed="true"]{background:var(--orange);border-color:var(--orange-line);color:#fff}
.btn.cool[aria-pressed="true"]{background:var(--blue);border-color:#2c5f96;color:#fff}
.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:7px;overflow:hidden}
.seg button{
  font-family:inherit;font-size:13px;font-weight:700;border:none;background:var(--card);
  color:var(--ink2);padding:8px 13px;cursor:pointer;border-right:1px solid var(--rule)
}
.seg button:last-child{border-right:none}
.seg button[aria-selected="true"]{background:var(--ink);color:#fff}
.seg.warm button[aria-selected="true"]{background:var(--orange);color:#fff}
.tog{
  display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
  color:var(--ink2);border:1px solid var(--rule2);border-radius:7px;padding:7px 12px;
  cursor:pointer;background:var(--card);user-select:none;
}
.tog input{accent-color:var(--orange);width:14px;height:14px;cursor:pointer}
.spacer{flex:1}

/* ---------- aside ---------- */
aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:118px}
.panel{
  background:var(--card);border:1px solid var(--rule);border-radius:12px;overflow:hidden;
}
.panel > h3{
  font-size:11px;font-weight:800;letter-spacing:.13em;color:var(--ink3);
  padding:11px 14px 9px;border-bottom:1px solid var(--rule);background:#FCFAF5;
}
.pbody{padding:13px 14px 15px}
.pbody .ph{font-size:15.5px;font-weight:800;letter-spacing:-.03em;margin-bottom:2px}
.pbody .role{
  display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;
  padding:2px 8px;border-radius:20px;margin-bottom:9px;
  background:var(--orange-soft);color:#8a4712;
}
.pbody .role.b{background:var(--blue-soft);color:#255183}
.pbody .role.t{background:var(--teal-soft);color:#1d6259}
.pbody .role.p{background:var(--purple-soft);color:#54397e}
.pbody dl{font-size:13px;line-height:1.62}
.pbody dt{font-weight:700;color:var(--ink2);margin-top:9px;font-size:12px;letter-spacing:.02em}
.pbody dd{color:var(--ink2)}
.pbody .hint{color:var(--ink3);font-size:12.5px;line-height:1.6}
.pbody .adv{
  margin-top:11px;padding:9px 11px;border-radius:7px;background:#F6F2E8;
  border-left:3px solid var(--rule2);font-size:12.5px;color:var(--ink2)
}
.pbody .adv b{color:var(--ink);font-weight:800}
kbd.f{font-family:var(--serif);font-size:14px;font-style:normal}

/* legend */
.legend{padding:11px 13px 13px;display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}
.lg{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink2);font-weight:600}
.lg svg{flex:none}
.lg.full{grid-column:1/-1}

/* counters */
.counts{padding:11px 13px 13px;display:flex;flex-wrap:wrap;gap:6px}
.cnt{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);
  border-radius:20px;padding:4px 11px 4px 8px;font-size:12px;font-weight:700;background:#FCFAF5;
  transition:transform .2s,background .3s;
}
.cnt.on{background:var(--orange-soft);border-color:var(--orange);transform:scale(1.05)}
.cnt b{font-family:var(--serif);font-size:14px}

/* quiz */
.quiz{padding:13px 14px 15px}
.quiz .q{font-size:13.5px;font-weight:700;line-height:1.55;margin-bottom:10px}
.qopts{display:flex;flex-direction:column;gap:6px}
.qopt{
  font-family:inherit;text-align:left;font-size:13px;font-weight:600;
  border:1px solid var(--rule2);background:var(--card);color:var(--ink2);
  padding:8px 11px;border-radius:7px;cursor:pointer;transition:.12s;
}
.qopt:hover{border-color:var(--ink3);background:#FBF8F1}
.qopt.ok{background:#E3F2E0;border-color:#7CB36E;color:#2f5b28}
.qopt.no{background:#FBE4E0;border-color:#D89187;color:#8c3226}
.qfb{margin-top:10px;font-size:12.5px;line-height:1.6;color:var(--ink2);display:none}
.qfb.show{display:block}
.qctx{font-size:11.5px;font-weight:700;color:var(--ink3);margin-bottom:6px;letter-spacing:.01em}
.qnav{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.qnav .btn{font-size:12px;padding:6px 10px}

/* summary modal */
.modal{
  position:fixed;inset:0;background:rgba(38,35,30,.55);z-index:80;
  display:none;align-items:center;justify-content:center;padding:24px;
}
.modal.open{display:flex}
.mcard{
  background:var(--card);border-radius:14px;max-width:660px;width:100%;
  max-height:86vh;overflow:auto;padding:26px 28px 24px;
}
.mcard h3{font-size:19px;font-weight:800;letter-spacing:-.03em;margin-bottom:4px}
.mcard .sub{font-size:12px;color:var(--ink3);margin-bottom:16px}
.mcard ul{margin:0 0 4px 0;padding-left:0;list-style:none}
.mcard li{
  font-size:13.5px;line-height:1.65;color:var(--ink2);
  padding:9px 0 9px 16px;border-top:1px solid var(--rule);position:relative;
}
.mcard li:before{content:"";position:absolute;left:0;top:17px;width:6px;height:6px;border-radius:50%;background:var(--orange)}
.mcard li b{color:var(--ink);font-weight:800}
.mclose{margin-top:18px}
table.cmp{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:6px}
table.cmp th,table.cmp td{border:1px solid var(--rule);padding:6px 9px;text-align:left}
table.cmp th{background:#F6F1E6;font-weight:700;font-size:11.5px;letter-spacing:.02em}
table.cmp td.no{color:#a33;font-weight:700}
table.cmp td.yes{color:#2f6b3e;font-weight:700}

footer{
  max-width:1560px;margin:0 auto;padding:16px 22px 26px;
  font-size:11.5px;color:var(--ink3);border-top:1px solid var(--rule);margin-top:16px;
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
}

/* ---------- svg shared ---------- */
.hot{cursor:pointer}
.hot .hit{fill:transparent;stroke:none}
.hot .ring{
  fill:none;stroke:var(--orange);stroke-width:2.5;opacity:0;
  stroke-dasharray:4 4;transition:opacity .15s;
}
.hot:hover .ring{opacity:.85}
.hot.sel .ring{opacity:1;stroke-dasharray:none;stroke-width:3}
text:not([font-family]){font-family:var(--sans)}
text:not([fill]){fill:var(--ink)}
.lrres{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding:10px 8px 4px;font-size:13px}
.lrres .t{font-weight:800;margin-right:6px}
.lrres span b{color:var(--ink2);font-weight:700;margin-right:4px}
.f{font-family:var(--serif)}
.lbl{font-size:13px;font-weight:600}
.lbl-s{font-size:11.5px;font-weight:600;fill:var(--ink2)}
.lbl-xs{font-size:10.5px;font-weight:600;fill:var(--ink3)}
.zone{font-size:12.5px;font-weight:800;letter-spacing:-.02em}
.note{font-size:11.5px;font-weight:600;fill:var(--magenta)}
.dim{opacity:.16;transition:opacity .35s}
.flow{transition:opacity .3s}
.hide{opacity:0;pointer-events:none}
.pulse{animation:pl 1.6s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.45}}
.dash{stroke-dasharray:6 5;animation:dm 1s linear infinite}
@keyframes dm{to{stroke-dashoffset:-11}}
.adv-only{display:none}
body.adv .adv-only{display:block}
.adv-inline{display:none}
body.adv .adv-inline{display:inline-flex}
.btn.inh[aria-pressed="true"]{background:#B23B2E;border-color:#8c2b20;color:#fff}

@media (prefers-reduced-motion:reduce){
  .pulse,.dash{animation:none}
  *{transition-duration:.01ms !important}
}
@media (max-width:1180px){
  main{grid-template-columns:1fr}
  aside{position:static;flex-direction:row;flex-wrap:wrap}
  aside > .panel{flex:1 1 300px}
}
@media (max-width:640px){
  /* 휴대폰: 머리말이 화면을 가리지 않도록 고정을 풀고 한 줄로 줄인다 */
  header{position:static}
  .hbar{padding:8px 12px 0;gap:10px;flex-wrap:nowrap;align-items:center}
  .brand{padding-bottom:0;min-width:0}
  .brand h1{font-size:16px;white-space:nowrap}
  .brand span{display:none}
  .maintabs{margin-left:auto;flex:none;align-self:flex-end}
  .maintabs button{padding:7px 12px;font-size:13px}
  .subtabs{padding:0 6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .subtabs::-webkit-scrollbar{display:none}
  .subtabs button{padding:8px 9px;font-size:12px;white-space:nowrap;flex:none}
  main{padding:14px 12px}
}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="brand">
      <h1>광합성과 세포호흡</h1>
      <span>세포와 물질대사 인터랙티브 탐구</span>
    </div>
    <nav class="maintabs" id="maintabs" role="tablist">
      <button role="tab" data-main="ps" aria-selected="true">광합성</button>
      <button role="tab" data-main="cr" aria-selected="false">세포호흡</button>
    </nav>
  </div>
  <div class="subbar">
    <nav class="subtabs" id="subtabs" role="tablist"></nav>
  </div>
</header>

<main>
  <div class="stage-col">
    <div class="stagehead">
      <h2 id="viewTitle">—</h2>
      <p id="viewSub"></p>
    </div>
    <div class="ctrl" id="ctrl"></div>
    <div class="stage" id="stage"></div>
  </div>

  <aside>
    <div class="panel">
      <h3>탐구 안내</h3>
      <div class="pbody" id="info"></div>
    </div>
    <div class="panel" id="countPanel" hidden>
      <h3>산물 계수기</h3>
      <div class="counts" id="counts"></div>
    </div>
    <div class="panel" id="quizPanel" hidden>
      <h3>확인 질문</h3>
      <div class="quiz" id="quiz"></div>
    </div>
    <div class="panel">
      <h3>범례</h3>
      <div class="legend" id="legend"></div>
    </div>
  </aside>
</main>

<footer>
  <span>ⓒ 이재빈, 광덕고등학교 세포와 물질대사</span>
  <span>교과서 표기 기준 제작. 도식의 배치와 색상은 교과서 그림을 따릅니다.</span>
</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="mcard" id="mcard"></div>
</div>

<script>
/* ============================================================
   광합성과 세포호흡 인터랙티브 탐구
   ⓒ 이재빈, 광덕고등학교 세포와 물질대사
   ============================================================ */
"use strict";
const $=s=>document.querySelector(s);

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

// 같은 이름표(id 또는 t-클래스)를 가진 요소를 한꺼번에 다룬다
function Q(svg,id){
  const els=svg.querySelectorAll("#"+id+",.t-"+id);
  return {classList:{toggle:(c,f)=>els.forEach(e=>e.classList.toggle(c,f)),add:c=>els.forEach(e=>e.classList.add(c)),remove:c=>els.forEach(e=>e.classList.remove(c))},
          style:new Proxy({},{set:(o,k,v)=>{els.forEach(e=>e.style[k]=v);return true}}),
          setAttribute:(a,v)=>els.forEach(e=>e.setAttribute(a,v))};
}
const advT=(x,y,t,a="start",c="#6b3fa0")=>`<text class="lbl-xs" x="${x}" y="${y}" text-anchor="${a}" style="fill:${c};font-size:12.5px">${t}</text>`;
/* ---------- SVG 헬퍼 ---------- */

// 탄소 원자를 회색 원으로 n개 이어 붙인다. 학생이 개수를 직접 셀 수 있게 하는 것이 목적.
function beads(x,y,n,o={}){
  const r=o.r||8.5, gap=o.gap||(r*2+1.5);
  let s=`<g class="beads" ${o.id?`id="${o.id}"`:""}>`;
  for(let i=0;i<n;i++){
    s+=`<circle cx="${x+i*gap}" cy="${y}" r="${r}" fill="var(--carbon)" stroke="var(--carbon-line)" stroke-width="1"/>`;
    s+=`<circle cx="${x+i*gap-r*.32}" cy="${y-r*.34}" r="${r*.26}" fill="#8b8996" opacity=".65"/>`;
  }
  s+=`</g>`;
  return s;
}
const beadW=(n,r=8.5)=>(n-1)*(r*2+1.5)+r*2;

// 인산기: 교과서와 동일하게 노란 원 안에 P
function phos(x,y,r=9){
  return `<g><circle cx="${x}" cy="${y}" r="${r}" fill="var(--phos)" stroke="var(--phos-line)" stroke-width="1"/>`+
         `<text class="f" x="${x}" y="${y+3.6}" text-anchor="middle" font-size="${r*1.25}" font-weight="700" fill="#6b4a12">P</text></g>`;
}
function pi(x,y){
  return `<text class="f" x="${x}" y="${y}" text-anchor="middle" font-size="13" font-weight="600">P<tspan font-size="9" dy="3" font-style="italic">i</tspan></text>`;
}

// ATP: 노란 별
function starPts(cx,cy,r1,r2,n){
  let p=[];
  for(let i=0;i<n*2;i++){
    const a=(Math.PI/n)*i - Math.PI/2, r=(i%2?r2:r1);
    p.push((cx+Math.cos(a)*r).toFixed(1)+","+(cy+Math.sin(a)*r).toFixed(1));
  }
  return p.join(" ");
}
function atpStar(x,y,label="ATP",o={}){
  const R=o.R||26;
  return `<g ${o.id?`id="${o.id}"`:""} ${o.cls?`class="${o.cls}"`:""}>`+
    `<polygon points="${starPts(x,y,R,R*.62,11)}" fill="var(--atp)" stroke="var(--atp-line)" stroke-width="1.2"/>`+
    `<text class="f" x="${x}" y="${y+4.5}" text-anchor="middle" font-size="${o.fs||13}" font-weight="700" fill="#5c4304">${label}</text></g>`;
}

// 환원형 조효소 라벨 (주황 알약)
function pill(x,y,t,o={}){
  const w=o.w||(t.length*8.4+16), h=o.h||21;
  const fill=o.fill||"var(--orange-soft)", stroke=o.stroke||"#E0A46A";
  return `<g ${o.id?`id="${o.id}"`:""} ${o.cls?`class="${o.cls}"`:""}>`+
    `<rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="4" fill="${fill}" stroke="${stroke}" stroke-width="1"/>`+
    `<text class="f" x="${x}" y="${y+4.4}" text-anchor="middle" font-size="${o.fs||13.5}" font-weight="700" fill="${o.tc||"#8a4712"}">${t}</text></g>`;
}
// 조효소가 아닌 일반 화합물 라벨
function tag(x,y,t,o={}){
  const w=o.w||(t.length*8+16), h=o.h||20;
  return `<g><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="4" fill="${o.fill||"#fff"}" stroke="${o.stroke||"var(--rule2)"}"/>`+
    `<text x="${x}" y="${y+4.2}" text-anchor="middle" font-size="${o.fs||12}" font-weight="700" fill="${o.tc||"var(--ink2)"}">${t}</text></g>`;
}

// H+ 이온
function hIon(x,y,r=11){
  return `<g><circle cx="${x}" cy="${y}" r="${r}" fill="url(#gH)" stroke="#7FA9C6" stroke-width="1"/>`+
   `<text class="f" x="${x}" y="${y+3.8}" text-anchor="middle" font-size="${r*1.05}" font-weight="600">H<tspan font-size="${r*.72}" dy="-${r*.42}">+</tspan></text></g>`;
}
// 전자 (교과서와 동일하게 2e- 묶음)
function eBall(x,y,t="2e",r=13){
  return `<g><circle cx="${x}" cy="${y}" r="${r}" fill="#CFE3F2" stroke="#5E9BC9" stroke-width="1.2"/>`+
   `<text class="f" x="${x}" y="${y+4}" text-anchor="middle" font-size="12" font-weight="600">${t}<tspan font-size="9" dy="-4">−</tspan></text></g>`;
}

// 클릭 가능 영역 표시
function hot(id,x,y,w,h,rx=8){
  return `<g class="hot" data-info="${id}" tabindex="0" role="button">`+
    `<rect class="hit" x="${x}" y="${y}" width="${w}" height="${h}"/>`+
    `<rect class="ring" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"/></g>`;
}
function hotC(id,cx,cy,r){
  return `<g class="hot" data-info="${id}" tabindex="0" role="button">`+
    `<circle class="hit" cx="${cx}" cy="${cy}" r="${r}"/>`+
    `<circle class="ring" cx="${cx}" cy="${cy}" r="${r}"/></g>`;
}

// 화살표 마커 정의
function defs(){

["광합성에서 O₂가 발생하는 단계는?","명반응",["탄소고정반응","RuBP 재생 단계","3PG의 환원 단계"],"O₂ 화살표가 어느 블록 아래로 나오는지 보자.","명반응에서 물이 광분해될 때 O₂가 발생한다."],
["순환적 전자흐름만 일어날 때 O₂가 방출되지 않는 이유는?","물의 광분해가 일어나지 않기 때문이다.",["CO₂가 고정되지 않기 때문이다.","ATP가 만들어지지 않기 때문이다.","광계 I이 작동하지 않기 때문이다."],"O₂가 어떤 반응에서 나오는지와 순환 경로에서 전자가 어디서 오는지 연결해 보자.","순환적 전자흐름에서는 전자가 광계 I로 되돌아오므로 물에서 전자를 보충할 필요가 없어 O₂가 나오지 않는다."],
["광합성 결과 방출되는 O₂의 산소 원자는 어느 물질에서 유래했는가?","H₂O",["CO₂","포도당","NADPH"],"O₂를 만드는 반응의 반응물을 보자.","O₂는 물의 광분해로 생긴다. 따라서 산소 원자는 물에서 유래한다."]],
glu:[
["포도당이 합성되는 곳은?","스트로마",["타이라코이드 내부","타이라코이드 막","엽록체 외막"],"탄소고정반응이 일어나는 장소를 떠올려 보자.","캘빈회로에서 만들어진 PGAL로 스트로마에서 포도당이 합성된다."],
["포도당 1분자를 만들려면 CO₂ 몇 분자가 고정되어야 하는가?","6분자",["1분자","3분자","12분자"],"포도당의 탄소 수를 떠올려 보자.","포도당(C₆)의 탄소 6개는 모두 CO₂에서 오므로 CO₂ 6분자가 필요하다."],
["광합성으로 만들어진 포도당의 쓰임으로 옳은 것은?","세포호흡의 출발 물질이 된다.",["명반응의 전자공여체가 된다.","루비스코를 활성화한다.","O₂로 분해된다."],"포도당이 다음에 어떤 과정으로 들어가는지 생각해 보자.","포도당은 세포호흡으로 분해되어 ATP를 만드는 데 쓰인다."]]
},
"ps-lr":{
_all:[
["순환적 전자흐름만 일어나는 조건에서 관찰되지 않는 것은?","O₂ 방출과 NADPH 생성",["ATP 생성","광계 I의 빛 흡수","H⁺ 농도 기울기 형성"],"순환 경로에서 전자가 어디서 나와 어디로 돌아가는지 따라가 보자.","전자가 광계 I로 되돌아오므로 NADPH가 생기지 않고, 물의 광분해가 없어 O₂도 나오지 않는다. 전자전달계는 지나므로 ATP는 만들어진다."],
["비순환적 전자흐름에서 전자의 이동 순서로 옳은 것은?","H₂O → 광계 II → 전자전달계 → 광계 I → NADP⁺",["H₂O → 광계 I → 전자전달계 → 광계 II → NADP⁺","NADP⁺ → 광계 I → 전자전달계 → 광계 II → H₂O","광계 I → 전자전달계 → 광계 I"],"주황색 화살표를 처음부터 끝까지 따라가 보자.","물에서 나온 전자는 광계 II → 전자전달계 → 광계 I을 거쳐 NADP⁺를 NADPH로 환원한다. 마지막 보기는 순환적 경로이다."],
["두 경로에서 모두 만들어지는 물질은?","ATP",["NADPH","O₂","ATP와 NADPH"],"두 경로가 공통으로 지나는 구조를 찾아보자.","두 경로 모두 광계 I과 II 사이의 전자전달계를 지나므로 H⁺ 농도 기울기가 생겨 ATP가 만들어진다."],
["명반응에서 H⁺ 농도가 가장 높은 곳은?","타이라코이드 내부",["스트로마","엽록체 외막 밖","세포질"],"H⁺이 능동수송되는 방향을 떠올려 보자.","전자전달계가 H⁺을 스트로마에서 타이라코이드 내부로 퍼 넣고, 물의 광분해로도 내부에 H⁺이 생긴다."]],
p680:[
["P₆₈₀에 대한 설명으로 옳은 것은?","광계 II의 반응 중심 엽록소 a이다.",["광계 I의 반응 중심 엽록소이다.","680 nm의 빛을 반사한다.","NADP⁺를 직접 환원한다."],"'680'이라는 숫자와 어느 광계에 있는지 확인해 보자.","P₆₈₀은 광계 II의 반응 중심 엽록소 a로, 680 nm의 빛을 가장 잘 흡수한다."],
["P₆₈₀이 잃은 전자를 채워 주는 것은?","물의 광분해로 나온 전자",["광계 I에서 되돌아온 전자","NADPH의 전자","CO₂의 전자"],"광계 II 옆에 붙어 있는 반응을 보자.","P₆₈₀이 잃은 전자는 물이 광분해되며 나온 전자로 보충된다."],
["빛을 받은 P₆₈₀에서 방출된 전자가 가장 먼저 전달되는 곳은?","광계 II의 1차 전자수용체",["광계 I의 1차 전자수용체","NADP⁺","ATP 합성효소"],"P₆₈₀에서 위로 올라가는 화살표 끝을 보자.","들뜬 전자는 곧바로 1차 전자수용체로 전달되고, 이후 전자전달계로 간다."]],
p700:[
["P₇₀₀이 참여하는 경로로 옳은 것은?","비순환적 전자흐름과 순환적 전자흐름 모두",["비순환적 전자흐름만","순환적 전자흐름만","두 경로 모두 참여하지 않는다."],"주황과 파랑 화살표가 모두 P₇₀₀에서 출발하는지 보자.","광계 I의 P₇₀₀은 두 경로 모두에서 빛을 받아 전자를 방출한다."],
["비순환적 전자흐름에서 P₇₀₀이 잃은 전자를 채우는 것은?","광계 II에서 전자전달계를 거쳐 온 전자",["물에서 직접 온 전자","NADPH의 전자","자신에게 되돌아온 전자"],"광계 I로 들어오는 주황 화살표가 어디서 오는지 보자.","비순환적 경로에서는 광계 II → 전자전달계를 거친 전자가 P₇₀₀을 채운다. 자기 전자가 되돌아오는 것은 순환적 경로이다."],
["순환적 전자흐름에서 P₇₀₀이 잃은 전자는 어떻게 보충되는가?","전자전달계를 거쳐 되돌아온 자신의 전자로 보충된다.",["물의 광분해로 보충된다.","NADPH에서 보충된다.","광계 II에서 보충된다."],"파란 화살표가 한 바퀴 도는 경로를 따라가 보자.","순환적 경로에서는 전자가 전자전달계를 거쳐 다시 P₇₀₀으로 돌아오므로 외부에서 전자를 보충할 필요가 없다."]],
ea2:[
["광계 II의 1차 전자수용체가 받는 전자의 출처는?","P₆₈₀",["P₇₀₀","H₂O에서 직접","NADPH"],"1차 전자수용체로 올라가는 화살표의 시작점을 보자.","빛을 받아 들뜬 P₆₈₀의 전자가 1차 전자수용체로 전달된다."],
["1차 전자수용체의 역할로 가장 알맞은 것은?","들뜬 전자를 재빨리 받아 전자전달계로 넘긴다.",["빛을 흡수해 전자를 방출한다.","H⁺을 능동수송한다.","ATP를 합성한다."],"전자가 원래 자리로 떨어지지 않게 하려면 무엇이 필요할지 생각해 보자.","1차 전자수용체는 들뜬 전자를 붙잡아 전자전달계로 전달한다."],
["에너지 준위 도식에서 1차 전자수용체가 반응 중심보다 위에 있는 이유는?","전자가 빛에너지를 받아 에너지 수준이 높아졌기 때문이다.",["전자가 에너지를 잃었기 때문이다.","물보다 무겁기 때문이다.","ATP를 만들었기 때문이다."],"세로축이 무엇을 나타내는지 보자.","세로축은 전자의 에너지 수준이다. 빛에너지를 흡수한 전자는 높은 에너지 상태로 1차 전자수용체에 전달된다."]],
ea1:[
["광계 I의 1차 전자수용체에서 두 경로가 갈라지는 방식으로 옳은 것은?","비순환적이면 NADP⁺로, 순환적이면 전자전달계를 거쳐 P₇₀₀으로 간다.",["비순환적이면 P₆₈₀으로, 순환적이면 NADP⁺로 간다.","두 경로 모두 NADP⁺로 간다.","두 경로 모두 물로 간다."],"1차 전자수용체에서 나가는 주황과 파랑 화살표의 끝을 비교하자.","이 지점이 두 경로의 갈림길이다. 비순환은 NADPH를 만들고, 순환은 전자가 광계 I로 돌아온다."],
["광계 I의 1차 전자수용체로 전자를 보내는 것은?","P₇₀₀",["P₆₈₀","H₂O","NADPH"],"아래에서 올라오는 화살표의 시작점을 보자.","빛을 받아 들뜬 P₇₀₀의 전자가 광계 I의 1차 전자수용체로 전달된다."],
["광계 I의 1차 전자수용체 이후 전자전달계를 거쳐 전자를 최종적으로 받는 물질은(비순환)?","NADP⁺",["O₂","H₂O","CO₂"],"주황 화살표 ❹의 끝에 있는 반응을 보자.","NADP⁺가 전자와 H⁺을 받아 NADPH로 환원된다."]],
etc1:[
["광계 II와 광계 I 사이의 전자전달계에서 방출된 에너지의 쓰임은?","H⁺을 스트로마에서 타이라코이드 내부로 능동수송한다.",["NADP⁺를 환원한다.","물을 광분해한다.","CO₂를 고정한다."],"에너지 방출 표시 아래 무엇이 만들어지는지 보자.","방출된 에너지로 H⁺을 퍼 넣어 농도 기울기를 만들고, 이 기울기로 ATP가 합성된다."],
["이 전자전달계를 지나는 경로는?","비순환적과 순환적 경로 모두",["비순환적 경로만","순환적 경로만","어느 경로도 지나지 않는다"],"이 전자전달계를 지나는 화살표 색을 확인하자.","두 경로 모두 이 전자전달계를 지난다. 그래서 두 경로 모두 ATP를 만든다."],
["전자가 전자전달계를 지날 때 전자의 에너지 변화로 옳은 것은?","단계적으로 감소한다.",["단계적으로 증가한다.","변하지 않는다.","한꺼번에 0이 된다."],"에너지 준위 도식에서 전자전달계 화살표의 기울기를 보자.","전자는 전자전달계를 지나며 조금씩 에너지를 방출해 에너지 수준이 낮아진다."]],
etc2:[
["광계 I 이후의 전자전달계를 지나는 경로는?","비순환적 전자흐름만",["순환적 전자흐름만","두 경로 모두","어느 경로도 지나지 않는다"],"이 전자전달계를 지나는 화살표 색을 확인하자.","NADP⁺로 향하는 이 구간은 비순환적 전자흐름에서만 지난다."],
["이 전자전달계를 거친 전자의 최종 수용체는?","NADP⁺",["O₂","P₆₈₀","H₂O"],"화살표 ❹의 끝을 보자.","NADP⁺ + 2H⁺ + 2e⁻ → NADPH + H⁺"],
["이 구간이 작동하지 않으면 생기지 않는 물질은?","NADPH",["ATP만","O₂만","H⁺"],"이 전자전달계 끝에서 만들어지는 물질을 보자.","광계 I 이후 전자전달계가 막히면 NADP⁺가 환원되지 못해 NADPH가 만들어지지 않는다."]],
h2o:[
["명반응에서 H₂O가 하는 일은?","광계 II에 전자를 공급한다.",["광계 I에 전자를 공급한다.","최종 전자수용체가 된다.","CO₂와 결합한다."],"물에서 나온 전자가 어느 반응 중심으로 가는지 보자.","물이 광분해되며 나온 전자가 P₆₈₀이 잃은 전자를 채운다."],
["물의 광분해로 생긴 H⁺이 있는 곳은?","타이라코이드 내부",["스트로마","엽록체 밖","세포질"],"막 구조 도식에서 물이 분해되는 쪽을 보자.","물은 타이라코이드 내부에서 분해되므로 H⁺이 내부에 쌓여 농도 기울기 형성에 기여한다."],
["물의 광분해가 일어나는 경로는?","비순환적 전자흐름",["순환적 전자흐름","두 경로 모두","캘빈회로"],"경로 선택 버튼을 바꾸며 물 반응이 보이는지 확인하자.","전자를 외부에서 보충해야 하는 비순환적 경로에서만 물이 분해된다."]],
nadph:[
["NADPH 생성 반응식으로 옳은 것은?","NADP⁺ + 2H⁺ + 2e⁻ → NADPH + H⁺",["NADPH → NADP⁺ + H⁺ + 2e⁻","NAD⁺ + 2H → NADH + H⁺","H₂O → 2H⁺ + ½O₂ + 2e⁻"],"NADP⁺가 전자를 얻는 식을 찾자.","NADP⁺가 전자와 수소를 받아 NADPH로 환원된다."],
["NADPH가 만들어지는 장소는?","스트로마 쪽",["타이라코이드 내부","엽록체 외막","막사이공간"],"막 구조 도식에서 NADPH가 그려진 쪽을 보자.","NADPH는 스트로마 쪽에서 만들어져 그 자리에서 캘빈회로에 쓰인다."],
["NADPH가 쓰이는 곳은?","캘빈회로의 환원 단계",["물의 광분해","광계 II의 전자 보충","ATP 합성효소"],"NADPH가 전자를 주는 물질을 떠올려 보자.","NADPH는 BPGA를 PGAL로 환원하는 데 쓰인다."]],
psii:[
["광계 II가 참여하지 않는 경로는?","순환적 전자흐름",["비순환적 전자흐름","두 경로 모두 참여한다","물의 광분해"],"'순환적만'을 골랐을 때 흐려지는 광계를 보자.","순환적 전자흐름은 광계 I만 참여한다."],
["광계 II의 구성으로 옳은 것은?","여러 색소 + 반응 중심 엽록소 a(P₆₈₀)",["여러 색소 + 반응 중심 엽록소 a(P₇₀₀)","ATP 합성효소 + 색소","루비스코 + 색소"],"광계 II 안의 반응 중심 표시를 보자.","주변 색소가 모은 빛에너지가 반응 중심 P₆₈₀으로 전달된다."],
["광계 II에 대한 설명으로 옳은 것은?","물의 광분해와 연결되어 있다.",["NADP⁺를 직접 환원한다.","스트로마에 떠 있다.","CO₂를 고정한다."],"광계 II 옆에 붙어 있는 반응을 보자.","광계 II가 잃은 전자는 물의 광분해로 보충된다."]],
psi:[
["광계 I에 대한 설명으로 옳은 것은?","두 경로 모두에 참여한다.",["비순환적 경로에만 참여한다.","물을 분해한다.","반응 중심이 P₆₈₀이다."],"두 색의 화살표가 모두 지나는 광계를 찾자.","광계 I은 비순환적·순환적 경로 모두에 참여하며 반응 중심은 P₇₀₀이다."],
["광계 I의 반응 중심 엽록소는?","P₇₀₀",["P₆₈₀","엽록소 b","카로티노이드"],"광계 I 안의 표시를 확인하자.","광계 I의 반응 중심은 700 nm 빛을 가장 잘 흡수하는 P₇₀₀이다."],
["광계 I에서 방출된 전자가 비순환적으로 흐를 때 결과는?","NADPH가 만들어진다.",["O₂가 만들어진다.","물이 만들어진다.","CO₂가 고정된다."],"❹번 경로의 끝을 보자.","광계 I의 전자는 전자전달계를 거쳐 NADP⁺를 NADPH로 환원한다."]],
atp:[
["명반응에서 ATP가 합성되는 원리는?","H⁺ 농도 기울기를 이용한 화학삼투",["기질수준인산화","물의 광분해","NADPH의 산화"],"H⁺이 어디에 쌓이고 어디로 흘러 나가는지 떠올려 보자.","전자전달계가 만든 H⁺ 농도 기울기를 따라 H⁺이 ATP 합성효소를 통과할 때 ATP가 합성된다."],
["ATP 합성의 에너지 출처는?","전자가 전자전달계를 지나며 방출한 에너지",["포도당의 분해","CO₂의 고정","NADPH의 합성"],"'에너지 방출' 표시가 어디에 있는지 보자.","전자전달계에서 방출된 에너지로 H⁺을 퍼 넣고, 그 기울기로 ATP를 만든다."],
["ATP가 만들어지는 경로는?","비순환적과 순환적 경로 모두",["비순환적 경로만","순환적 경로만","어느 경로에서도 만들어지지 않는다"],"결과 요약 줄에서 ATP 항목을 확인하자.","두 경로 모두 전자전달계를 지나 H⁺ 농도 기울기를 만들므로 ATP가 생긴다."]],
syn:[
["엽록체의 ATP 합성효소를 통과하는 H⁺의 이동 방향은?","타이라코이드 내부 → 스트로마",["스트로마 → 타이라코이드 내부","엽록체 밖 → 스트로마","스트로마 → 엽록체 밖"],"H⁺ 농도가 높은 곳과 낮은 곳을 떠올려 보자.","H⁺은 농도가 높은 타이라코이드 내부에서 스트로마로 확산하며 ATP 합성효소를 통과한다."],
["ATP가 만들어지는 쪽과 그 이점으로 옳은 것은?","스트로마 쪽, 캘빈회로에 바로 쓰일 수 있다.",["타이라코이드 내부 쪽, 물 분해에 쓰인다.","스트로마 쪽, 물 분해에 쓰인다.","타이라코이드 내부 쪽, 캘빈회로에 쓰인다."],"ATP 합성효소의 머리 부분이 어느 쪽을 향하는지 보자.","ATP 합성효소의 머리는 스트로마 쪽에 있어 만들어진 ATP가 캘빈회로에 바로 투입된다."],
["ATP 합성효소를 통한 H⁺의 이동 방식은?","농도 기울기를 따른 확산",["농도 기울기를 거스르는 능동수송","세포내 섭취","삼투"],"H⁺이 높은 농도에서 낮은 농도로 가는지 보자.","H⁺은 농도 기울기를 따라 확산하며, 이때 방출되는 에너지로 ATP가 합성된다."]],
lumen:[
["타이라코이드 내부의 H⁺ 농도에 대한 설명으로 옳은 것은?","스트로마보다 높다.",["스트로마보다 낮다.","스트로마와 같다.","H⁺이 전혀 없다."],"막 구조 도식에서 H⁺ 개수를 비교해 보자.","H⁺이 능동수송되고 물의 광분해로도 생기므로 내부의 H⁺ 농도가 스트로마보다 높다."],
["타이라코이드 내부에 H⁺이 쌓이는 두 경로로 옳은 것은?","전자전달계의 능동수송, 물의 광분해",["ATP 합성효소, 물의 광분해","NADPH 합성, 능동수송","CO₂ 고정, 물의 광분해"],"H⁺이 내부로 들어오는 화살표와 내부에서 생기는 반응을 찾자.","전자전달계가 스트로마의 H⁺을 퍼 넣고, 물이 내부에서 분해되며 H⁺이 생긴다."],
["세포호흡에서 타이라코이드 내부에 해당하는 공간은?","막사이공간",["바탕질","세포질","외막"],"H⁺이 쌓이는 닫힌 공간끼리 짝지어 보자.","두 과정 모두 닫힌 공간(타이라코이드 내부, 막사이공간)에 H⁺을 가둔다."]],
stroma:[
["스트로마에서 일어나는 반응은?","탄소고정반응",["물의 광분해","광계 II의 빛 흡수","H⁺의 능동수송"],"캘빈회로 효소가 있는 곳을 떠올려 보자.","스트로마에서는 명반응 산물을 이용한 탄소고정반응이 일어난다."],
["스트로마 쪽에서 만들어지는 명반응의 산물은?","ATP와 NADPH",["O₂와 H⁺","물과 CO₂","포도당과 O₂"],"막 구조 도식의 스트로마 쪽에 그려진 산물을 보자.","ATP와 NADPH는 스트로마 쪽에서 만들어져 바로 캘빈회로에 쓰인다."],
["세포호흡에서 스트로마에 해당하는 공간은?","바탕질",["막사이공간","세포질","크리스타"],"ATP가 만들어지는 쪽끼리 짝지어 보자.","두 과정 모두 H⁺ 농도가 낮고 ATP가 만들어지는 쪽이 각각 스트로마와 바탕질이다."]],
pump:[
["명반응에서 H⁺의 능동수송 방향은?","스트로마 → 타이라코이드 내부",["타이라코이드 내부 → 스트로마","엽록체 밖 → 스트로마","스트로마 → 엽록체 밖"],"파란 H⁺ 화살표의 방향을 보자.","전자전달계는 H⁺을 스트로마에서 타이라코이드 내부로 퍼 넣는다."],
["H⁺ 능동수송의 에너지원은?","전자가 전자전달계를 지나며 방출한 에너지",["ATP의 분해","빛에너지를 직접 사용","NADPH의 합성"],"능동수송이 어느 구조에서 일어나는지 보자.","전자전달계를 지나는 전자가 방출한 에너지로 H⁺을 농도 기울기를 거슬러 이동시킨다."],
["이 능동수송이 멈추면 가장 먼저 영향을 받는 것은?","ATP 합성",["물의 광분해","빛 흡수","CO₂의 확산"],"H⁺ 농도 기울기를 이용하는 장치를 떠올려 보자.","H⁺ 농도 기울기가 만들어지지 않으면 화학삼투로 ATP를 만들 수 없다."]]

["CO₂ 6분자가 고정되면 만들어지는 PGAL 12분자 중 RuBP 재생에 쓰이는 것은?","10분자",["2분자","6분자","12분자"],"CO₂ 3분자일 때의 비율(6 중 5)을 두 배로 늘려 보자.","CO₂ 3분자당 PGAL 6분자 중 5분자가 재생에 쓰이므로, 두 배면 12분자 중 10분자이다."],
["캘빈회로의 세 단계를 순서대로 나열한 것은?","탄소고정 → 환원 → RuBP 재생",["환원 → 탄소고정 → RuBP 재생","RuBP 재생 → 환원 → 탄소고정","탄소고정 → RuBP 재생 → 환원"],"CO₂가 들어오는 지점에서 시계 방향으로 따라가 보자.","CO₂가 RuBP에 고정되고(❶), 3PG가 PGAL로 환원되며(❷), PGAL 일부로 RuBP가 재생된다(❸)."],

fix:[

red:[

["환원 단계에서 탄소 수의 변화는?","변하지 않는다(C₃ → C₃).",["3에서 5로 늘어난다.","3에서 2로 줄어든다.","6에서 3으로 줄어든다."],"3PG, BPGA, PGAL의 구슬 수를 비교하자.","3PG, BPGA, PGAL 모두 C₃이다. 바뀌는 것은 에너지 수준이다."],
["환원 단계를 '환원'이라 부르는 이유는?","NADPH가 전자와 수소를 주기 때문이다.",["CO₂가 빠져나가기 때문이다.","ATP가 만들어지기 때문이다.","O₂가 결합하기 때문이다."],"NADPH가 무엇을 내주는지 생각해 보자.","BPGA가 NADPH로부터 전자와 수소를 받아 PGAL이 되므로 환원이다."]],
reg:[

["RuBP 재생이 중요한 이유는?","RuBP가 있어야 다음 CO₂를 고정할 수 있다.",["RuBP가 포도당이 되기 때문이다.","RuBP가 O₂를 만들기 때문이다.","RuBP가 NADPH를 만들기 때문이다."],"RuBP가 회로의 어느 단계에서 다시 쓰이는지 보자.","RuBP가 재생되지 않으면 CO₂를 붙잡을 물질이 없어 회로가 멈춘다."],
["RuBP 재생 단계에서 탄소 수의 변화로 옳은 것은?","5 × C₃ = 15 → 3 × C₅ = 15",["6 × C₃ = 18 → 3 × C₅ = 15","5 × C₃ = 15 → 5 × C₅ = 25","1 × C₃ = 3 → 3 × C₅ = 15"],"PGAL 5분자와 RuBP 3분자의 구슬 수를 세어 보자.","탄소 15개가 그대로 보존되며 배열만 바뀐다."]],
co2:[

rubisco:[

["루비스코가 있는 장소는?","스트로마",["타이라코이드 내부","타이라코이드 막","엽록체 외막"],"캘빈회로가 일어나는 장소를 떠올리자.","루비스코는 스트로마에 있는 효소이다."],
["루비스코에 대한 설명으로 옳은 것은?","지구에서 가장 양이 많은 효소로 알려져 있다.",["빛을 흡수해 전자를 방출한다.","ATP를 합성한다.","NADP⁺를 환원한다."],"루비스코가 하는 일과 관계없는 보기를 먼저 지워 보자.","루비스코는 광합성 생물에 매우 많이 들어 있는 효소이다."]],

pbpga:[

"cr-op":{
_all:[

["산화적 인산화에서 H⁺의 농도가 높은 곳은?","막사이공간",["바탕질","세포질","외막 바깥"],"H⁺ 개수를 비교해 보자.","전자전달계가 바탕질의 H⁺을 막사이공간으로 퍼내므로 막사이공간의 H⁺ 농도가 높다."],
["포도당 1분자 기준 산화적 인산화로 만들어지는 ATP는?","28분자",["2분자","4분자","32분자"],"NADH 10 × 2.5 + FADH₂ 2 × 1.5를 계산하자.","25 + 3 = 28ATP가 산화적 인산화로 만들어진다. 32는 기질수준인산화 4를 합한 수이다."],
["짝풀림제를 처리했을 때 나타나는 현상으로 옳은 것은?","전자전달은 계속되지만 ATP 합성은 크게 줄어든다.",["전자전달이 멈추고 ATP도 멈춘다.","ATP 합성이 늘어난다.","O₂ 소비가 멈춘다."],"심화 표기를 켜고 '짝풀림제 처리'를 눌러 보자.","H⁺이 새 통로로 새어 나가 기울기가 사라지므로 ATP는 줄지만 전자전달과 O₂ 소비는 계속된다."]],

/* ---------- 확인 문제 출제 ----------
   선택한 요소(없으면 전체 과정)에 대한 문제를 무작위로 낸다.
   틀리면 고른 보기만 표시하고 힌트를 준다. 정답은 맞힐 때까지 드러내지 않는다. */
const QS={key:null,last:{}};
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function quizFor(key){
  const bank=QB[state.view], p=$("#quizPanel");
  if(!bank){ p.hidden=true; return; }
  const k=(key&&bank[key])?key:"_all";
  QS.key=k;
  const list=bank[k];
  let idx; const prev=QS.last[state.view+k];
  do{ idx=Math.floor(Math.random()*list.length); }while(list.length>1 && idx===prev);
  QS.last[state.view+k]=idx;
  renderQ(list[idx],k,list.length);
}
function renderQ(item,k,n){
  const [q,ans,wrong,hint,exp]=item, p=$("#quizPanel");
  p.hidden=false; p.querySelector("h3").textContent="확인 질문";
  const info=(VIEW[state.view].info||{})[k];
  const ctx = k==="_all" ? "전체 과정" : "선택: "+(info?info.t:k);
  const opts=shuffle([ans,...wrong]);
  $("#quiz").innerHTML=`<div class="qctx">${ctx} · 문제 ${n}개 중 무작위</div><div class="q">${q}</div><div class="qopts">`+
    opts.map((t,i)=>`<button class="qopt" data-i="${i}">${t}</button>`).join("")+
    `</div><div class="qfb" id="qfb"></div><div class="qnav"><button class="btn" id="qNext">다른 문제</button>`+
    (k!=="_all"?`<button class="btn" id="qAll">전체 과정 문제</button>`:"")+`</div>`;
  $("#quiz").querySelectorAll(".qopt").forEach(b=>b.addEventListener("click",()=>{
    const fb=$("#qfb");
    if(b.textContent===ans){
      $("#quiz").querySelectorAll(".qopt").forEach(x=>x.disabled=true);
      b.classList.add("ok");
      fb.innerHTML=`<b style="color:#2f6b3e">정답입니다.</b> ${exp}`;
    }else{
      b.classList.add("no"); b.disabled=true;
      fb.innerHTML=`<b style="color:#8c3226">다시 생각해 보세요.</b> 힌트: ${hint}`;
    }
    fb.classList.add("show");
  }));
  $("#qNext").onclick=()=>quizFor(k==="_all"?null:k);
  if($("#qAll")) $("#qAll").onclick=()=>quizFor(null);
}

/* ---------- 핵심 요약 ---------- */
function summary(title,sub,items,extra){
  $("#mcard").innerHTML=`<h3>${title}</h3><div class="sub">${sub}</div>`+
    `<ul>${items.map(i=>`<li>${i}</li>`).join("")}</ul>`+(extra||"")+
    `<button class="btn primary mclose" id="mclose">닫기</button>`;
  $("#modal").classList.add("open");
  $("#mclose").onclick=()=>$("#modal").classList.remove("open");
}
$("#modal").addEventListener("click",e=>{ if(e.target.id==="modal") $("#modal").classList.remove("open"); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") $("#modal").classList.remove("open"); });

/* ---------- 굵은 선의 화살촉 교체 ---------- */
function fixMarkers(svg){
  svg.querySelectorAll("[marker-end],[marker-start]").forEach(el=>{
    const w=parseFloat(el.getAttribute("stroke-width")||"0");
    if(w<6) return;
    ["marker-end","marker-start"].forEach(a=>{
      const v=el.getAttribute(a);
      if(v&&/url\(#a(Or|Bl|Te|Pu|Re)\)/.test(v)) el.setAttribute(a,v.replace(/\)$/,"L)"));
    });
  });
}

/* ---------- 라우터 ---------- */
function renderSubtabs(){
  $("#subtabs").innerHTML=SUB[state.main].map(([id,t])=>
    `<button role="tab" data-view="${id}" aria-selected="${id===state.view}">${t}</button>`).join("");
  $("#subtabs").querySelectorAll("button").forEach(b=>
    b.onclick=()=>go(b.dataset.view));
}
function go(view){
  if(state.cleanup){ try{state.cleanup();}catch(e){} state.cleanup=null; }
  state.quizLock=false;
  const main=view.startsWith("ps")?"ps":"cr";
  state.main=main; state.view=view;
  $$("#maintabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.main===main));
  renderSubtabs();
  const v=VIEW[view];
  $("#viewTitle").textContent=v.title;
  $("#viewSub").textContent=v.sub||"";
  $("#ctrl").innerHTML=v.ctrl||"";
  $("#stage").innerHTML=`<svg viewBox="${v.vb}" role="img" aria-label="${v.title} 도식">${defs()}${v.svg()}</svg>`;
  fixMarkers($("#stage").querySelector("svg"));
  setLegend(v.legend||[]);
  setCounts(v.counts?v.counts():null);
  quizFor(null);
  showInfo(null);
  bindHots($("#stage"),v.info||{});
  if(v.init) v.init($("#stage").querySelector("svg"));
  window.scrollTo({top:0,behavior:"smooth"});
}
$$("#maintabs button").forEach(b=>b.onclick=()=>go(SUB[b.dataset.main][0][0]));

        : [["참여 광계","두 경로가 함께"],["물의 광분해","비순환적에서만"],["O₂ 방출","비순환적에서만"],["NADPH","비순환적에서만"],["ATP","두 경로 모두"]];
      const tt = LR.mode==="cyc"?"순환적 전자흐름의 결과":LR.mode==="non"?"비순환적 전자흐름의 결과":"결과 요약";
      const tc = LR.mode==="cyc"?"var(--blue)":LR.mode==="non"?"var(--orange)":"var(--ink)";
      box.innerHTML=`<span class="t" style="color:${tc}">${tt}</span>`+rows.map(r=>`<span><b>${r[0]}</b><span style="color:${r[2]===1?"#B23B2E":r[2]===2?"#2f6b3e":"var(--ink2)"}">${r[1]}</span></span>`).join("");
    }
    $$("#lrMode button").forEach(b=>b.setAttribute("aria-selected",b.dataset.m===LR.mode));
    $$("#lrView button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===LR.view));
    $("#lrNext").disabled = LR.step>=MAXSTEP[LR.mode];
  }
  function stop(){ if(timer){clearInterval(timer);timer=null;} const b=$("#lrPlay"); if(b) b.textContent="빛 비추기"; }
  state.cleanup=()=>{ if(timer){clearInterval(timer);timer=null;} };

  $$("#lrView button").forEach(b=>b.onclick=()=>{ LR.view=b.dataset.v; go("ps-lr"); });
  $$("#lrMode button").forEach(b=>b.onclick=()=>{ stop(); LR.mode=b.dataset.m; LR.step=MAXSTEP[LR.mode]; upd(); });
  $("#lrNext").onclick=()=>{ stop(); LR.step=Math.min(LR.step+1,MAXSTEP[LR.mode]); upd(); };
  $("#lrAll").onclick=()=>{ stop(); LR.step=MAXSTEP[LR.mode]; upd(); };
  $("#lrPlay").onclick=()=>{
    if(timer){ stop(); return; }
    LR.step=0; upd(); $("#lrPlay").textContent="정지";
    timer=setInterval(()=>{
      LR.step++; upd();
      if(LR.step>=MAXSTEP[LR.mode]) stop();
    },1100);
  };
  const adv=$("#lrAdv");
  adv.checked=state.adv;
  adv.onchange=()=>{ state.adv=adv.checked; document.body.classList.toggle("adv",state.adv); };
  document.body.classList.toggle("adv",state.adv);

  $("#lrCmp").onclick=()=>summary("비순환적 전자흐름과 순환적 전자흐름","무엇이 같고 무엇이 다른가",[

    "순환적 경로에서는 전자가 P<sub>700</sub>으로 <b>되돌아오므로</b> 잃은 전자를 물에서 채울 필요가 없다. → <b>물의 광분해가 없다 → O₂도 없다</b>.",
    "전자가 NADP⁺로 빠져나가지 않으므로 <b>NADPH도 생성되지 않는다</b>."
  ],lrCmpTable());
  $("#lrSum").onclick=()=>summary("명반응","핵심 정리",[
    "빛에너지를 흡수한 <b>반응 중심 엽록소 a</b>가 들뜬 전자를 방출하고, <b>1차 전자수용체</b>가 이를 받는다.",
    "전자가 <b>전자전달계</b>를 내려오며 방출한 에너지로 H⁺을 스트로마에서 <b>타이라코이드 내부로 능동수송</b>한다.",
    "막을 경계로 형성된 <b>H⁺ 농도 기울기</b>를 따라 H⁺이 ATP 합성효소를 통해 스트로마로 확산되며 <b>ATP가 합성된다(화학삼투)</b>.",
    "비순환적 경로에서는 <b>물의 광분해</b>로 전자를 보충하고 O₂를 방출하며, 최종적으로 <b>NADPH</b>를 만든다.",
    "순환적 경로에서는 <b>ATP만</b> 만들어진다. O₂도 NADPH도 없다.",
    "만들어진 ATP와 NADPH는 <b>스트로마 쪽</b>에서 생기므로 그대로 탄소고정반응에 투입된다."
  ]);
  upd();
};

<script>

   광합성 탄소고정반응(캘빈회로) 탭
   축척: CO₂ 3분자 기준 회로 1바퀴 (교과서 그림 기준)

const pt=(cx,cy,r,a)=>[cx+r*Math.cos(a*Math.PI/180), cy+r*Math.sin(a*Math.PI/180)];
function arcP(cx,cy,r,a0,a1){
  const [x0,y0]=pt(cx,cy,r,a0),[x1,y1]=pt(cx,cy,r,a1);
  const lg=((a1-a0+360)%360)>180?1:0;
  return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${lg} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
}
function slice(cx,cy,r,a0,a1,fill){
  const [x0,y0]=pt(cx,cy,r,a0),[x1,y1]=pt(cx,cy,r,a1);
  const lg=((a1-a0+360)%360)>180?1:0;
  return `<path d="M${cx} ${cy} L${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${lg} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z" fill="${fill}"/>`;
}
// 탄소를 구슬로 그린 화합물. 학생이 탄소 개수를 직접 셀 수 있게 하는 것이 핵심.
function mol(cx,cy,n,label,ps=[],cnt=null,o={}){
  const gap=18.5, w=beadW(n), x0=cx-w/2+8.5;
  let s=`<g ${o.id?`id="${o.id}"`:""} ${o.cls?`class="${o.cls}"`:""}>`;
  if(cnt!=null) s+=`<text class="f" x="${cx-w/2-15}" y="${cy+5}" font-size="16" font-weight="600" text-anchor="middle">${cnt}</text>`;
  ps.forEach(i=>{
    s+=`<line x1="${x0+i*gap}" y1="${cy-8}" x2="${x0+i*gap}" y2="${cy-22}" stroke="var(--phos-line)" stroke-width="1.6"/>`;
    s+=phos(x0+i*gap,cy-30);
  });
  s+=beads(x0,cy,n);
  s+=`<text x="${cx}" y="${cy+30}" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">${label}</text>`;
  s+=`</g>`;
  return s;
}

  init(svg){
    const G=["tS1","tS2","tS3","tS4","tS5","tS6"];
    const ARC=["tA1","tA2","tA3","tA4","tA5","tA6"];
    const CUM=[
      {NADH:0,"FADH₂":0,ATP:0,"CO₂":0},
      {NADH:0,"FADH₂":0,ATP:0,"CO₂":0},
      {NADH:1,"FADH₂":0,ATP:0,"CO₂":1},
      {NADH:2,"FADH₂":0,ATP:1,"CO₂":2},
      {NADH:2,"FADH₂":1,ATP:1,"CO₂":2},
      {NADH:2,"FADH₂":1,ATP:1,"CO₂":2},
      {NADH:3,"FADH₂":1,ATP:1,"CO₂":2}
    ];
    function upd(){
      G.forEach((id,i)=>{
        const on=i<TCA.step;
        Q(svg,id).classList.toggle("dim",!on);
        Q(svg,ARC[i]).classList.toggle("dim",!on);
      });
      const m=TCA.turn, c=CUM[Math.min(TCA.step,6)];
      Object.entries(c).forEach(([k,v])=>bumpCount(k, v*m));
      svg.querySelector("#tcaTurnT").textContent = m===1?"회로 1회전 기준":"2회전 총계 (포도당 1분자 기준)";
      svg.querySelector("#tcaTurnS").textContent = m===1
        ? "아세틸조효소 A 1분자가 완전히 산화된다"
        : "피루브산이 2분자이므로 모든 산물이 2배가 된다";
      $$("#tcaTurn button").forEach(b=>b.setAttribute("aria-selected",+b.dataset.t===m));
      $("#tcaNext").disabled=TCA.step>=6;
    }
    $$("#tcaTurn button").forEach(b=>b.onclick=()=>{ TCA.turn=+b.dataset.t; upd(); });
    $("#tcaPlay").onclick=()=>{ TCA.step=0; upd(); };
    $("#tcaNext").onclick=()=>{ TCA.step=Math.min(TCA.step+1,6); upd(); };
    $("#tcaAll").onclick=()=>{ TCA.step=6; upd(); };
    $("#tcaSum").onclick=()=>summary("TCA 회로","핵심 정리",[
      "장소는 <b>마이토콘드리아 바탕질</b>.",
      "<b>❶</b> 아세틸조효소 A(C₂) + 옥살아세트산(C₄) → 시트르산(C₆). 조효소 A는 떨어져 나와 재사용된다.",

      "<b>❸</b> α-케토글루타르산(C₅) → 석신산(C₄): <b>NADH, CO₂, ATP(기질수준인산화)</b>",
      "<b>❹</b> 석신산(C₄) → 푸마르산(C₄): <b>FADH₂</b>",
      "<b>❺</b> 푸마르산(C₄) + H₂O → 말산(C₄): 산물 없음",
      "<b>❻</b> 말산(C₄) → 옥살아세트산(C₄): <b>NADH</b>. 회로가 다시 시작될 수 있다.",
      "<b>1회전 총계: 3NADH, 1FADH₂, 1ATP, 2CO₂</b>",
      "포도당 1분자 기준으로는 <b>2회전</b>하므로 <b>6NADH, 2FADH₂, 2ATP, 4CO₂</b>",

    ]);
    TCA.step=6; upd();
  }
};

      ["펌프의 수","전자가 지나는 복합체 중 3곳이 H⁺을 퍼낸다. 어디서 출발하느냐에 따라 몇 곳을 거치는지가 달라진다."]
    ]},
    o2:{t:"O₂",r:"최종 전자수용체",d:[
      ["반응","2H⁺ + ½O₂ + 2e⁻ → H₂O"],
      ["왜 필요한가","전자전달계 끝에서 전자를 받아 줄 물질이 없으면 전자가 정체되어 앞의 모든 단계가 멈춘다."],
      ["비유","줄지어 선 사람들이 물통을 넘기는데, 맨 끝에서 받아 주는 사람이 없으면 전체가 멈추는 것과 같다."],
      ["산소를 마시는 이유","우리가 숨 쉬는 산소는 결국 여기서 전자를 받아 물이 되기 위한 것이다."]
    ]},
    syn:{t:"ATP 합성효소",r:"화학삼투가 일어나는 통로",d:[
      ["작동","막사이공간의 H⁺이 농도 기울기를 따라 바탕질로 확산될 때 나오는 에너지로 ADP + Pᵢ → ATP"],
      ["ATP가 만들어지는 쪽","<b>바탕질</b>"],
      ["광합성과의 공통점","구조와 원리가 같다. 다만 H⁺이 흐르는 방향과 장소가 다를 뿐이다."],
      ["산화적 인산화라 부르는 이유","NADH와 FADH₂의 <b>산화</b>에서 나온 에너지로 ADP를 <b>인산화</b>하기 때문이다."]
    ]},
    ims:{t:"막사이공간",r:"H⁺이 쌓이는 공간",rc:"b",d:[
      ["H⁺ 농도","바탕질보다 높다."],
      ["왜","전자전달계가 바탕질에서 H⁺을 퍼 올려 여기에 가두기 때문이다."],
      ["광합성과 비교","타이라코이드 내부에 해당하는 공간이다. 둘 다 <b>닫힌 공간에 H⁺을 가둔다</b>."]
    ]},
    mat:{t:"바탕질",r:"H⁺ 농도가 낮은 쪽",rc:"p",d:[
      ["여기서 일어나는 것","피루브산의 산화, TCA 회로. 그리고 ATP 합성"],
      ["H⁺ 농도","막사이공간보다 낮다."],
      ["광합성과 비교","스트로마에 해당한다. 둘 다 ATP가 만들어지는 쪽이다."]
    ]}
  },
  init(svg){
    const INH={
      syn:{t:"심화 실험: ATP 합성효소 저해",r:"H⁺이 돌아올 통로를 막으면?",d:[
        ["ATP 합성","<b>멈춘다.</b> H⁺이 ATP 합성효소를 통과하지 못한다."],

        ["전자전달","<b>느려지다가 거의 멈춘다.</b> 기울기가 너무 커지면 H⁺을 더 퍼내기 어려워지기 때문이다."],
        ["O₂ 소비","<b>줄어든다.</b> 전자전달이 느려지니 최종 전자수용체인 O₂도 덜 쓰인다."],
        ["생각해 볼 점","전자전달과 ATP 합성은 서로 다른 장치지만, H⁺ 농도 기울기를 통해 서로 묶여(짝지어져) 있다."]
      ]},
      unc:{t:"심화 실험: 짝풀림제 처리",r:"내막에 H⁺ 통로를 뚫으면?",d:[
        ["H⁺ 농도 기울기","<b>사라진다.</b> H⁺이 ATP 합성효소를 거치지 않고 새로 생긴 통로로 새어 나간다."],
        ["ATP 합성","<b>크게 줄어든다.</b> ATP 합성효소를 지나는 H⁺이 거의 없다."],
        ["전자전달","<b>계속된다. 오히려 빨라진다.</b> 거스를 기울기가 없어 H⁺을 퍼내기 쉬워진다."],
        ["O₂ 소비","<b>계속되거나 늘어난다.</b> 전자전달이 멈추지 않기 때문이다."],
        ["에너지의 행방","ATP로 저장되지 못한 에너지는 <b>열</b>로 방출된다."],
        ["생각해 볼 점","전자전달과 ATP 합성의 '짝'을 풀어 버리므로 짝풀림제라 한다. 산소 차단과 결과를 비교해 보자."]
      ]}
    };
    function upd(){
      if(!state.adv) OP.inh=null;
      const g=["opEN","opEF","opEM","opP1","opP3","opP4","opO2g","opSyn"];
      g.forEach(id=>Q(svg,id).classList.toggle("dim",!OP.o2));
      if(OP.o2){
        ["opEN","opEF","opEM","opP1","opP3","opP4"].forEach(id=>Q(svg,id).style.opacity=OP.inh==="syn"?".4":"");

      }

      Q(svg,"opLeak").classList.toggle("hide",OP.inh!=="unc");

      $("#opInhUnc").setAttribute("aria-pressed",OP.inh==="unc");
      Q(svg,"opNoO2").classList.toggle("hide",OP.o2);
      const b=$("#opO2"); b.textContent=OP.o2?"산소 차단":"산소 공급"; b.setAttribute("aria-pressed",OP.o2);
      Q(svg,"opCmpBox").classList.toggle("hide",!OP.cmp);

      // NADH만 거치는 첫 번째 펌프 한 곳만 강조해야 차이가 드러난다.
      Q(svg,"opP1").classList.toggle("pulse",OP.cmp);
      Q(svg,"opCmpTip").classList.toggle("hide",!OP.cmp);
      $("#opCmp").setAttribute("aria-pressed",OP.cmp);
    }
    $("#opO2").onclick=()=>{ OP.o2=!OP.o2; upd(); };
    $("#opCmp").onclick=()=>{ OP.cmp=!OP.cmp; upd(); };
    const setInh=k=>{ OP.inh = OP.inh===k?null:k; upd(); showInfo(OP.inh?INH[OP.inh]:null); };
    $("#opInhSyn").onclick=()=>setInh("syn");
    $("#opInhUnc").onclick=()=>setInh("unc");
    const adv=$("#opAdv"); adv.checked=state.adv;
    adv.onchange=()=>{ state.adv=adv.checked; document.body.classList.toggle("adv",state.adv); if(!state.adv&&OP.inh){ upd(); showInfo(null); } };
    document.body.classList.toggle("adv",state.adv);
    $("#opPS").onclick=()=>summary("광합성의 명반응과 세포호흡의 산화적 인산화","같은 원리, 다른 무대",[
      "둘 다 <b>전자가 전자전달계를 지나며 방출한 에너지로 H⁺을 닫힌 공간에 가둔다</b>.",
      "둘 다 그렇게 만든 <b>H⁺ 농도 기울기</b>를 따라 H⁺이 <b>ATP 합성효소</b>를 통과하며 ATP가 만들어진다. 이것이 <b>화학삼투</b>다.",
      "<b>H⁺이 갇히는 공간</b>: 광합성은 타이라코이드 내부, 세포호흡은 막사이공간",
      "<b>ATP가 만들어지는 쪽</b>: 광합성은 스트로마, 세포호흡은 바탕질",
      "<b>전자의 출처</b>: 광합성은 물(빛에너지로 밀어 올림), 세포호흡은 NADH와 FADH₂",
      "<b>전자의 최종 행선지</b>: 광합성은 NADP⁺ → NADPH, 세포호흡은 O₂ → H₂O",
      "정반대처럼 보이는 두 과정이 <b>똑같은 장치를 쓴다</b>는 점이 핵심이다."
    ]);
    $("#opSum").onclick=()=>summary("산화적 인산화","핵심 정리",[
      "장소는 <b>마이토콘드리아 내막</b>. 두 부분으로 나뉜다: <b>전자전달계</b>와 <b>화학삼투</b>.",
      "<b>전자전달계</b>: NADH와 FADH₂가 전자를 넘기고, 전자가 복합체를 지나며 방출한 에너지로 H⁺이 <b>바탕질 → 막사이공간</b>으로 능동수송된다.",
      "<b>최종 전자수용체는 O₂</b>. 2H⁺ + ½O₂ + 2e⁻ → H₂O. 산소가 없으면 전자가 정체되어 전체가 멈춘다.",
      "<b>화학삼투</b>: 막사이공간의 H⁺이 ATP 합성효소를 통해 바탕질로 확산되며 ATP가 합성된다.",
      "<b>NADH 1분자 → 2.5ATP</b> (H⁺ 펌프 3곳 통과), <b>FADH₂ 1분자 → 1.5ATP</b> (H⁺ 펌프 2곳 통과)",
      "포도당 1분자 기준: NADH 10분자 × 2.5 = <b>25ATP</b>, FADH₂ 2분자 × 1.5 = <b>3ATP</b> → 합계 <b>28ATP</b>",
      "세포호흡에서 만들어지는 ATP의 <b>대부분</b>이 이 단계에서 나온다."
    ]);
    upd();
  }
};
</script>
<script>
/* ============================================================
   세포호흡 전체 과정 한눈에 보기 탭
   ============================================================ */
const AL={step:4};

VIEW["cr-all"]={
  title:"전체 과정 한눈에 보기",
  sub:"포도당 1분자가 완전히 산화되기까지. 각 블록을 누르면 해당 탭으로 이동합니다",
  vb:"0 0 1180 720",
  legend:["atp","redox","sub","hot"],
  ctrl:`<button class="btn primary" id="alPlay">전체 재생</button>
        <button class="btn" id="alNext">다음 과정</button>
        <button class="btn" id="alAll">전체 보기</button>
        <label class="tog"><input type="checkbox" id="alAdv"> 심화 표기</label>
        <span class="spacer"></span>
        <button class="btn" id="alSum">핵심 요약</button>`,
  counts(){ return [{k:"누적 ATP",v:0},{k:"생성된 NADH",v:0},{k:"FADH₂",v:0},{k:"CO₂",v:0}]; },
  svg(){
    let s=FIG.all;
    const nav=(id,go,shape)=>`<g id="${id}" class="nav hot" data-go="${go}" tabindex="0" role="button">${shape.replace(/CLS/g,"hit")}${shape.replace(/CLS/g,"ring")}</g>`;
    s+=nav("navG1","cr-gl",`<rect class="CLS" x="58" y="238" width="274" height="144" rx="10"/>`);
    s+=nav("navG2","cr-po",`<rect class="CLS" x="450" y="250" width="144" height="120" rx="10"/>`);
    s+=nav("navG3","cr-tca",`<circle class="CLS" cx="714" cy="310" r="86"/>`);
    s+=nav("navG4","cr-op",`<rect class="CLS" x="878" y="248" width="214" height="128" rx="10"/>`);
    s+=`<g class="adv-only"><text class="lbl-xs" x="40" y="706">심화: 세포질의 NADH는 내막을 직접 통과하지 못해 셔틀로 전자를 넘긴다. 이때 FADH₂에 전달되는 조직에서는 그 2NADH가 3ATP만 만들어 총 30ATP가 된다.</text></g>`;
    return s;
  },
  init(svg){
    const G=["alG1","alG2","alG3","alG4"], N=["alN1","alN2","alN3"], A=["alA1","alA3","alA4"];
    const CUM=[
      {"누적 ATP":0,"생성된 NADH":0,"FADH₂":0,"CO₂":0},
      {"누적 ATP":2,"생성된 NADH":2,"FADH₂":0,"CO₂":0},
      {"누적 ATP":2,"생성된 NADH":4,"FADH₂":0,"CO₂":2},
      {"누적 ATP":4,"생성된 NADH":10,"FADH₂":2,"CO₂":6},
      {"누적 ATP":32,"생성된 NADH":10,"FADH₂":2,"CO₂":6}
    ];
    let timer=null;
    function upd(){
      G.forEach((id,i)=>Q(svg,id).classList.toggle("dim",i>=AL.step));
      Q(svg,"alN1").classList.toggle("dim",AL.step<1);
      Q(svg,"alN2").classList.toggle("dim",AL.step<2);
      Q(svg,"alN3").classList.toggle("dim",AL.step<3);
      Q(svg,"alA1").classList.toggle("dim",AL.step<1);
      Q(svg,"alA3").classList.toggle("dim",AL.step<3);
      Q(svg,"alA4").classList.toggle("dim",AL.step<4);
      const c=CUM[AL.step];
      Object.entries(c).forEach(([k,v])=>bumpCount(k,v));
      Q(svg,"alSum").classList.toggle("dim",AL.step<4);
      $("#alNext").disabled=AL.step>=4;
    }
    function stop(){ if(timer){clearInterval(timer);timer=null;} const b=$("#alPlay"); if(b) b.textContent="전체 재생"; }
    state.cleanup=()=>{ if(timer){clearInterval(timer);timer=null;} };
    $("#alPlay").onclick=()=>{
      if(timer){stop();return;}
      AL.step=0; upd(); $("#alPlay").textContent="정지";
      timer=setInterval(()=>{ AL.step++; upd(); if(AL.step>=4) stop(); },1300);
    };
    $("#alNext").onclick=()=>{ stop(); AL.step=Math.min(AL.step+1,4); upd(); };
    $("#alAll").onclick=()=>{ stop(); AL.step=4; upd(); };
    svg.querySelectorAll(".nav").forEach(g=>{
      const act=()=>go(g.dataset.go);
      g.addEventListener("click",act);
      g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();act();} });
    });
    const adv=$("#alAdv"); adv.checked=state.adv;
    adv.onchange=()=>{ state.adv=adv.checked; document.body.classList.toggle("adv",state.adv); };
    document.body.classList.toggle("adv",state.adv);
    showInfo({t:"전체 과정",r:"포도당 1분자 기준",d:[
      ["네 과정","해당 과정(세포질) → 피루브산의 산화(바탕질) → TCA 회로(바탕질) → 산화적 인산화(내막)"],
      ["블록을 눌러 보세요","각 과정의 자세한 도식으로 이동합니다."],
      ["가장 중요한 흐름","앞의 세 과정은 ATP를 거의 만들지 않는다. 대신 <b>NADH와 FADH₂에 전자를 담아</b> 산화적 인산화로 넘긴다."],
      ["최종 수확","2 + 2 + 28 = <b>32 ATP</b>"]
    ]});
    $("#alSum").onclick=()=>summary("세포호흡 전체","포도당 1분자 기준 정리",[
      "<b>해당 과정</b> (세포질): 순 2ATP, 2NADH, 피루브산 2분자. 산소 없이도 일어난다.",
      "<b>피루브산의 산화</b> (바탕질): 2NADH, 2CO₂, 아세틸조효소 A 2분자. ATP는 직접 만들지 않는다.",
      "<b>TCA 회로</b> (바탕질, 2회전): 2ATP, 6NADH, 2FADH₂, 4CO₂",
      "여기까지 만들어진 <b>NADH 10분자, FADH₂ 2분자</b>가 모두 산화적 인산화로 모인다.",
      "<b>산화적 인산화</b> (내막): NADH 10 × 2.5 = 25ATP, FADH₂ 2 × 1.5 = 3ATP → <b>28ATP</b>",
      "<b>기질수준인산화 4ATP + 산화적 인산화 28ATP = 총 32ATP</b>",
      "즉 ATP의 <b>약 88%</b>가 산화적 인산화에서 나온다. 앞의 세 과정의 진짜 역할은 <b>전자를 NADH와 FADH₂에 실어 나르는 것</b>이다.",
      "탄소의 행방: 포도당의 탄소 6개는 모두 <b>CO₂ 6분자</b>(피루브산의 산화 2 + TCA 회로 4)로 빠져나간다."
    ]);
    AL.step=4; upd();
  }
};

/* ============================================================
   세포호흡 발효 탭
   ============================================================ */

const FE_MAX={a:3,l:2};
const FE_EQ={
  a:`포도당(C<tspan font-size="13" dy="5">6</tspan><tspan dy="-5">)  ⟶  2에탄올(C</tspan><tspan font-size="13" dy="5">2</tspan><tspan dy="-5">) + 2CO</tspan><tspan font-size="13" dy="5">2</tspan><tspan dy="-5"> + 2ATP</tspan>`,
  l:`포도당(C<tspan font-size="13" dy="5">6</tspan><tspan dy="-5">)  ⟶  2젖산(C</tspan><tspan font-size="13" dy="5">3</tspan><tspan dy="-5">) + 2ATP</tspan>`
};
const FE_NOTE={
  a:["아세트알데하이드가 NADH로부터 전자와 수소를 받아 에탄올로 환원된다.","→ 이때 NADH가 NAD⁺로 산화되어 해당 과정에 다시 공급된다."],
  l:["피루브산이 NADH로부터 전자와 수소를 받아 젖산으로 환원된다.","→ 이때 NADH가 NAD⁺로 산화되어 해당 과정에 다시 공급된다."]
};
function feCmpTable(){

  init(svg){

      g.classList.toggle("dim",modeOk&&!stepOk);
    }
    function upd(){
      const m=FE.mode, st=FE.step, fin=FE_MAX[m];
      vis("feS1",true,st>=1 && !FE.block);
      vis("feA2",m==="a",st>=2 && !FE.block);
      vis("feA3",m==="a",st>=3 && !FE.block);
      vis("feL2",m==="l",st>=2 && !FE.block);
      vis("feRegen",true,st>=fin && !FE.block);
      vis("feNote",true,st>=fin && !FE.block);
      Q(svg,"feX").classList.toggle("hide",!FE.block);
      svg.querySelector("#feEq").innerHTML=FE_EQ[m];
      svg.querySelector("#feNote1").textContent=FE_NOTE[m][0];
      svg.querySelector("#feNote2").textContent=FE_NOTE[m][1];
      bumpCount("순 ATP", st>=1 ? (FE.block?"2 → 0":2) : 0);
      bumpCount("남은 NADH", st>=1 ? (st>=fin && !FE.block ? 0 : 2) : 0);
      bumpCount("CO₂", m==="a"&&st>=2 ? 2 : 0);
      $$("#feMode button").forEach(b=>b.setAttribute("aria-selected",b.dataset.m===m));
      $("#feNext").disabled = st>=fin;
      $("#feBlock").setAttribute("aria-pressed",FE.block);
    }
    $$("#feMode button").forEach(b=>b.onclick=()=>{ FE.mode=b.dataset.m; FE.step=FE_MAX[FE.mode]; upd(); showInfo(null); });

    $("#feNext").onclick=()=>{ FE.step=Math.min(FE.step+1,FE_MAX[FE.mode]); upd(); };
    $("#feAll").onclick=()=>{ FE.step=FE_MAX[FE.mode]; upd(); };
    $("#feBlock").onclick=()=>{
      FE.block=!FE.block; FE.step=FE_MAX[FE.mode]; upd();
      showInfo(FE.block?{t:"NAD⁺ 재생이 없다면?",r:"생각 실험",rc:"b",d:[
        ["처음에는","해당 과정이 몇 번 돌며 ATP를 만든다. 그때마다 NAD⁺가 NADH로 바뀐다."],

      "발효는 <b>산소가 없을 때</b> <b>세포질</b>에서 일어난다.",
      "<b>해당 과정</b>은 세포호흡과 같다. 포도당 1분자 → 피루브산 2분자 + <b>순 2ATP</b> + 2NADH",

      "마지막 단계에서 <b>NADH가 NAD⁺로 산화</b>된다. 이 단계에서 ATP는 만들어지지 않지만, NAD⁺가 재생되어야 <b>해당 과정이 계속</b> 일어날 수 있다.",
      "에탄올과 젖산에는 <b>많은 에너지가 남아 있다</b>. 그래서 발효는 세포호흡(32ATP)보다 훨씬 적은 ATP를 얻는다.",
      "예: 효모(빵, 술), 젖산균(김치, 요구르트), 산소가 부족할 때의 근육세포"
    ]);
    upd();
  }
};

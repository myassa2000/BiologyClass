<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세포의 구조와 세포소기관</title>
<style>
:root{
  --paper:#FAF7F0; --card:#FFFFFF;
  --ink:#25231E; --ink2:#5E584D; --ink3:#918977;
  --rule:#E0D8C7; --rule2:#CFC5AE;

  --cyto:#F6F1E2;          /* 세포질 */
  --cyto2:#EFE8D4;
  --memb:#58A9D8;          /* 세포막 */
  --memb2:#2E6C96;
  --wall:#7BA83E;          /* 세포벽 */
  --wall2:#4E7223;
  --nuc:#7B5BA8;           /* 핵 */
  --nuc2:#3F2A66;
  --nucleolus:#2E1B4D;
  --er:#8B6FB5;            /* 소포체 */
  --er2:#5B4483;
  --golgi:#3F9E96;         /* 골지체 */
  --golgi2:#1F6862;
  --mito:#A03A48;          /* 마이토콘드리아 */
  --mito2:#5E1826;
  --lyso:#C4548E;          /* 라이소솜 */
  --lyso2:#8A2F5F;
  --chloro:#4F8A32;        /* 엽록체 */
  --chloro2:#2C5119;
  --vac:#DDEBD4;           /* 액포 */
  --vac2:#7FA868;
  --cent:#4E9CB5;          /* 중심체 */
  --cent2:#266479;
  --skel:#7FB35E;          /* 세포골격 */
  --ribo:#E8963C;          /* 라이보솜 */
  --magenta:#BE3487;
  --blue:#3A7BC0; --blue-soft:#D3E3F4;
  --orange:#DE7A2C; --orange-soft:#F9DCC0;
  --green-soft:#DDEDD4; --purple-soft:#E6DCF4;
  --red:#C0392B;

  --sans:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR","Nanum Gothic",sans-serif;
  --serif:"Times New Roman","Nanum Myeongjo",Batang,"Batang",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}

header{border-bottom:1px solid var(--rule2);background:var(--paper);position:sticky;top:0;z-index:40}
.hbar{max-width:1560px;margin:0 auto;padding:14px 22px 0;display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;padding-bottom:12px}
.brand h1{font-size:19px;font-weight:800;letter-spacing:-.03em}
.brand span{font-size:12px;color:var(--ink3);letter-spacing:.06em}
.maintabs{display:flex;gap:6px;margin-left:auto}
.maintabs button{
  font-family:inherit;font-size:15px;font-weight:700;letter-spacing:-.02em;
  border:1px solid var(--rule2);border-bottom:none;background:#F2ECE0;color:var(--ink2);
  padding:10px 24px;border-radius:9px 9px 0 0;cursor:pointer;position:relative;top:1px;transition:background .15s,color .15s}
.maintabs button:hover{background:#EAE2D2}
.maintabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 -3px 0 0 var(--orange) inset}
.subbar{border-top:1px solid var(--rule2);background:#F6F1E6}
.subtabs{max-width:1560px;margin:0 auto;padding:0 22px;display:flex;gap:2px;flex-wrap:wrap}
.subtabs button{
  font-family:inherit;font-size:13.5px;font-weight:600;border:none;background:none;color:var(--ink3);
  padding:11px 16px;cursor:pointer;border-bottom:3px solid transparent;letter-spacing:-.02em;transition:color .15s}
.subtabs button:hover{color:var(--ink2)}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--orange)}

main{max-width:1560px;margin:0 auto;padding:20px 22px 8px;display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:20px;align-items:start}
.stage-col{min-width:0}
.stagehead{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.stagehead h2{font-size:17px;font-weight:800;letter-spacing:-.03em}
.stagehead p{font-size:12.5px;color:var(--ink3)}
.stage{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:8px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}

.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.btn{font-family:inherit;font-size:13px;font-weight:700;letter-spacing:-.02em;border:1px solid var(--rule2);
  background:var(--card);color:var(--ink);padding:8px 14px;border-radius:7px;cursor:pointer;transition:.15s}
.btn:hover{background:#F4EFE4}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#3b3830}
.btn:disabled{opacity:.38;cursor:default}
.btn[aria-pressed="true"]{background:var(--orange);border-color:#b8601a;color:#fff}
.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:7px;overflow:hidden}
.seg button{font-family:inherit;font-size:13px;font-weight:700;border:none;background:var(--card);color:var(--ink2);
  padding:8px 13px;cursor:pointer;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:none}
.seg button[aria-selected="true"]{background:var(--ink);color:#fff}
.seg.warm button[aria-selected="true"]{background:var(--orange);color:#fff}
.tog{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink2);
  border:1px solid var(--rule2);border-radius:7px;padding:7px 12px;cursor:pointer;background:var(--card);user-select:none}
.tog input{accent-color:var(--orange);width:14px;height:14px;cursor:pointer}
.spacer{flex:1}

aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:118px}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.panel > h3{font-size:11px;font-weight:800;letter-spacing:.13em;color:var(--ink3);
  padding:11px 14px 9px;border-bottom:1px solid var(--rule);background:#FCFAF5}
.pbody{padding:13px 14px 15px}
.pbody .ph{font-size:16px;font-weight:800;letter-spacing:-.03em;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.pbody .swatch{width:13px;height:13px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.25)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.tg{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:#EFEADC;color:var(--ink2)}
.tg.y{background:#DDEDD4;color:#3d6b2c}
.tg.n{background:#FBE4E0;color:#8c3226}
.tg.b{background:var(--blue-soft);color:#255183}
.pbody dl{font-size:13px;line-height:1.62}
.pbody dt{font-weight:700;color:var(--ink2);margin-top:9px;font-size:12px;letter-spacing:.02em}
.pbody dd{color:var(--ink2)}
.pbody .hint{color:var(--ink3);font-size:12.5px;line-height:1.6}
.pbody .adv{margin-top:11px;padding:9px 11px;border-radius:7px;background:#F6F2E8;border-left:3px solid var(--rule2);font-size:12.5px;color:var(--ink2)}
.pbody .adv b{color:var(--ink);font-weight:800}

.legend{padding:11px 13px 13px;display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}
.lg{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink2);font-weight:600}
.lg i{width:13px;height:13px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.22)}
.lg.full{grid-column:1/-1}

.quiz{padding:13px 14px 15px}
.quiz .q{font-size:13.5px;font-weight:700;line-height:1.55;margin-bottom:10px}
.qopts{display:flex;flex-direction:column;gap:6px}
.qopt{font-family:inherit;text-align:left;font-size:13px;font-weight:600;border:1px solid var(--rule2);
  background:var(--card);color:var(--ink2);padding:8px 11px;border-radius:7px;cursor:pointer;transition:.12s}
.qopt:hover{border-color:var(--ink3);background:#FBF8F1}
.qopt.ok{background:#E3F2E0;border-color:#7CB36E;color:#2f5b28}
.qopt.no{background:#FBE4E0;border-color:#D89187;color:#8c3226}
.qfb{margin-top:10px;font-size:12.5px;line-height:1.6;color:var(--ink2);display:none}
.qfb.show{display:block}

.modal{position:fixed;inset:0;background:rgba(38,35,30,.55);z-index:80;display:none;align-items:center;justify-content:center;padding:24px}
.modal.open{display:flex}
.mcard{background:var(--card);border-radius:14px;max-width:760px;width:100%;max-height:86vh;overflow:auto;padding:26px 28px 24px}
.mcard h3{font-size:19px;font-weight:800;letter-spacing:-.03em;margin-bottom:4px}
.mcard .sub{font-size:12px;color:var(--ink3);margin-bottom:16px}
.mcard ul{margin:0;padding-left:0;list-style:none}
.mcard li{font-size:13.5px;line-height:1.65;color:var(--ink2);padding:9px 0 9px 16px;border-top:1px solid var(--rule);position:relative}
.mcard li:before{content:"";position:absolute;left:0;top:17px;width:6px;height:6px;border-radius:50%;background:var(--orange)}
.mcard li b{color:var(--ink);font-weight:800}
.mclose{margin-top:18px}
table.cmp{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:6px}
table.cmp th,table.cmp td{border:1px solid var(--rule);padding:6px 9px;text-align:left}
table.cmp th{background:#F6F1E6;font-weight:700;font-size:11.5px}
table.cmp td.no{color:#a33;font-weight:700}
table.cmp td.yes{color:#2f6b3e;font-weight:700}
table.cmp td.mid{color:#8a6a12;font-weight:700}

footer{max-width:1560px;margin:16px auto 0;padding:16px 22px 26px;font-size:11.5px;color:var(--ink3);
  border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---- SVG 공통 ---- */
.hot{cursor:pointer}
.hot:focus{outline:none}
.hot:focus-visible .ring{opacity:1}
.hot .hit{fill:transparent;stroke:none}
.hot .ring{fill:none;stroke:var(--orange);stroke-width:2.5;opacity:0;stroke-dasharray:4 4;transition:opacity .15s}
.hot:hover .ring{opacity:.9}
.hot.sel .ring{opacity:1;stroke-dasharray:none;stroke-width:3.4}
.hot .lead{stroke:var(--ink3);stroke-width:1}
.hot:hover .lead,.hot.sel .lead{stroke:var(--orange);stroke-width:1.6}
.hot .cap{font-size:13px;font-weight:700;fill:var(--ink)}
.hot:hover .cap,.hot.sel .cap{fill:var(--orange)}
.cell-photo-image{pointer-events:none}
.cell-photo-part .ring{fill:rgba(222,122,44,.10);stroke-width:3;transition:opacity .15s,stroke-width .15s}
.cell-photo-part:hover .ring,.cell-photo-part.sel .ring{opacity:1}
.cell-photo-part.sel .ring{fill:rgba(222,122,44,.18);stroke-width:4}
.pulse .cell-photo-part .ring{opacity:1;fill:rgba(222,122,44,.18);stroke-width:4}
.hot .cell-memb-hit{fill:none;stroke:transparent;stroke-width:30;pointer-events:stroke}
.cell-photo-note{font-size:11.5px;font-weight:700;fill:var(--ink3)}
text{font-family:var(--sans);fill:var(--ink)}
.f{font-family:var(--serif)}
.lbl{font-size:13px;font-weight:600}
.lbl-s{font-size:11.5px;font-weight:600;fill:var(--ink2)}
.lbl-xs{font-size:10.5px;font-weight:600;fill:var(--ink3)}
.zone{font-size:12.5px;font-weight:800;letter-spacing:-.02em}
.note{font-size:11.5px;font-weight:600;fill:var(--magenta)}
.dim{opacity:.14;transition:opacity .35s}
.soft{opacity:.32;transition:opacity .35s}
.hide{opacity:0;pointer-events:none}
.pulse{animation:pl 1.5s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.4}}
.flash{animation:fl .8s ease-out}
@keyframes fl{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.adv-only{display:none}
body.adv .adv-only{display:block}
@media (prefers-reduced-motion:reduce){.pulse,.flash{animation:none}*{transition-duration:.01ms !important}}
@media (max-width:1180px){main{grid-template-columns:1fr}aside{position:static;flex-direction:row;flex-wrap:wrap}aside > .panel{flex:1 1 300px}}
@media (max-width:640px){
  .hbar{padding:12px 14px 0}.maintabs{margin-left:0;width:100%}
  .maintabs button{flex:1;padding:9px 6px;font-size:13px}
  .subtabs{padding:0 10px}.subtabs button{padding:9px 9px;font-size:12px}
  main{padding:14px 12px}
}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="brand">
      <h1>세포의 구조와 세포소기관</h1>
      <span>세포와 물질대사 인터랙티브 탐구</span>
    </div>
    <nav class="maintabs" id="maintabs" role="tablist">
      <button role="tab" data-main="pk" aria-selected="true">원핵세포와 진핵세포</button>
      <button role="tab" data-main="eu" aria-selected="false">진핵세포</button>
    </nav>
  </div>
  <div class="subbar"><nav class="subtabs" id="subtabs" role="tablist"></nav></div>
</header>

<main>
  <div class="stage-col">
    <div class="stagehead"><h2 id="viewTitle">—</h2><p id="viewSub"></p></div>
    <div class="ctrl" id="ctrl"></div>
    <div class="stage" id="stage"></div>
  </div>
  <aside>
    <div class="panel"><h3>세포소기관 설명</h3><div class="pbody" id="info"></div></div>
    <div class="panel" id="quizPanel" hidden><h3 id="quizTitle">확인 질문</h3><div class="quiz" id="quiz"></div></div>
    <div class="panel"><h3>범례</h3><div class="legend" id="legend"></div></div>
  </aside>
</main>

<footer>
  <span>ⓒ 이재빈, 광덕고등학교 세포와 물질대사</span>
  <span>도식은 각 소기관의 구조가 드러나도록 크기를 조정한 모식도입니다.</span>
</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="mcard" id="mcard"></div></div>

<script>
/* ============================================================
   세포의 구조와 세포소기관
   ⓒ 이재빈, 광덕고등학교 세포와 물질대사
   ============================================================ */
"use strict";
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));

/* ---------- 공통 SVG 헬퍼 ---------- */
function defs(){
  const mk=(id,c)=>`<marker id="${id}" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">`+
    `<path d="M0,0.6 L9.4,5 L0,9.4 z" fill="${c}"/></marker>`;
  // 입체감은 방사형 그러데이션으로 낸다. 광원은 왼쪽 위에 있다고 가정한다.
  const rg=(id,c0,c1,c2,cx="34%",cy="26%")=>`<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="84%">`+
    `<stop offset="0" stop-color="${c0}"/>${c2?`<stop offset=".5" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/>`:`<stop offset="1" stop-color="${c1}"/>`}</radialGradient>`;
  const lg=(id,c0,c1,x2="0%",y2="100%")=>`<linearGradient id="${id}" x1="0%" y1="0%" x2="${x2}" y2="${y2}">`+
    `<stop offset="0" stop-color="${c0}"/><stop offset="1" stop-color="${c1}"/></linearGradient>`;
  return `<defs>
    ${mk("aOr","var(--orange)")}${mk("aBl","var(--blue)")}${mk("aGy","#7d766a")}${mk("aRe","#D0483A")}${mk("aPu","var(--golgi2)")}
    ${rg("gCytoA","#FDFBF4","#F0E6D2","#DFCFB2","40%","30%")}
    ${rg("gCytoL","#F6FBEE","#E4EFD6","#CFE0BC","40%","30%")}
    ${rg("gNucS","#C3A9E8","#7B5BA8","#3F2A66")}
    ${rg("gNucC","#5E4090","#2E1B4D",null,"46%","36%")}
    ${rg("gNuclo","#6B4CA0","#241338",null,"38%","32%")}
    ${rg("gMito","#D4707C","#A03A48","#5E1826","36%","24%")}
    ${rg("gMitoIn","#F2C3C6","#C87884",null,"38%","28%")}
    ${rg("gChl","#A6D98A","#4F8A32","#274A15","34%","22%")}
    ${rg("gChlIn","#DCF0C8","#8CC46A",null,"36%","26%")}
    ${lg("gGolgi","#69C6BC","#1F6862")}
    ${lg("gGolgiV","#8FDCD3","#2E7E76")}
    ${rg("gLyso","#E495BE","#C4548E","#8A2F5F","34%","26%")}
    ${rg("gCent","#8FD0E4","#4E9CB5","#266479","32%","26%")}
    ${lg("gER","#B79AE0","#6B4C9A")}
    ${lg("gSER","#F0C08A","#B5793A")}
    ${rg("gVac","#FBFEF8","#E2EFD8","#C2D9B0","34%","24%")}
    ${lg("gWall","#9CC45E","#4E7223")}
    ${lg("gWallIn","#C6DE96","#7BA83E")}
    ${lg("gMembRim","#BEE6F7","#5FA8D8")}
    ${rg("gRibo","#F6C089","#C87137",null,"32%","28%")}
    <filter id="sh" x="-40%" y="-40%" width="185%" height="185%">
      <feDropShadow dx="1.6" dy="2.6" stdDeviation="3" flood-color="#3a2f22" flood-opacity=".3"/></filter>
    <filter id="shS" x="-40%" y="-40%" width="185%" height="185%">
      <feDropShadow dx="1" dy="1.6" stdDeviation="1.6" flood-color="#3a2f22" flood-opacity=".32"/></filter>
    <pattern id="bilayer" width="13" height="16" patternUnits="userSpaceOnUse">
      <circle cx="6.5" cy="4" r="3.4" fill="#BEE6F7" stroke="var(--memb2)" stroke-width=".8"/>
      <path d="M5 7.4 q-.8 4 0 6 M8 7.4 q.8 4 0 6" stroke="#E0A94E" stroke-width=".9" fill="none"/>
    </pattern>
    <pattern id="wallTex" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="url(#gWallIn)"/>
      <path d="M0 7 h20 M0 14 h20 M7 0 v7 M15 7 v7 M4 14 v6" stroke="#6F9A34" stroke-width="1.1" opacity=".65"/>
    </pattern>
  </defs>`;
}
function hotC(id,cx,cy,r){
  return `<g class="hot" data-o="${id}" tabindex="0" role="button">`+
    `<circle class="hit" cx="${cx}" cy="${cy}" r="${r}"/><circle class="ring" cx="${cx}" cy="${cy}" r="${r}"/></g>`;
}
function hotR(id,x,y,w,h,rx=8){
  return `<g class="hot" data-o="${id}" tabindex="0" role="button">`+
    `<rect class="hit" x="${x}" y="${y}" width="${w}" height="${h}"/>`+
    `<rect class="ring" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"/></g>`;
}
// 교과서와 같은 번호 원판. 두 도식이 번호를 공유하므로 학생이 곧바로 대조할 수 있다.
function numDot(x,y,n){
  return "";
}
// 라벨 + 번호 + 지시선 + 클릭 영역을 한 덩어리로
function tagHot(id,label,tx,ty,anchor,path,hit,num){
  const [hx,hy,hw,hh,hr]=hit;
  const n=num!==undefined?num:(ORG[id]&&ORG[id].no);
  let dot="";
  if(n){
    const w=label.length*13+4;
    dot=numDot(anchor==="start"?tx-13:anchor==="end"?tx+13:tx+w/2+13, ty-4.5, n);
  }
  const dotSide=anchor==="start"?"left":"right";
  return `<g class="hot tag-label" data-o="${id}" data-dot-side="${dotSide}" tabindex="0" role="button">`+
    `<path class="lead" d="${path}" fill="none"/>${dot}`+
    `<text class="cap" x="${tx}" y="${ty}" text-anchor="${anchor}">${label}</text>`+
    `<rect class="hit" x="${hx}" y="${hy}" width="${hw}" height="${hh}"/>`+
    `<rect class="ring" x="${hx}" y="${hy}" width="${hw}" height="${hh}" rx="${hr||8}"/></g>`;
}
function cellPhotoPart(id,groupId,imgX,imgY,shapes,membrane=false){
  const ellipses=shapes.map(([cx,cy,rx,ry])=>{
    if(membrane){
      return `<ellipse class="cell-memb-hit" cx="${imgX+cx}" cy="${imgY+cy}" rx="${rx}" ry="${ry}"/>`+
        `<ellipse class="ring" cx="${imgX+cx}" cy="${imgY+cy}" rx="${rx}" ry="${ry}"/>`;
    }
    return `<ellipse class="hit" cx="${imgX+cx}" cy="${imgY+cy}" rx="${rx}" ry="${ry}"/>`+
      `<ellipse class="ring" cx="${imgX+cx}" cy="${imgY+cy}" rx="${rx}" ry="${ry}"/>`;
  }).join("");
  return `<g id="${groupId}"><g class="hot cell-photo-part" data-o="${id}" tabindex="0" role="button" aria-label="${ORG[id].n}">${ellipses}</g></g>`;
}
// 사진 속 구조는 클릭할 수 있지만 별도의 타원 강조선은 표시하지 않는다.
function cellPhotoHitOnly(id,groupId,imgX,imgY,shapes){
  const hits=shapes.map(([cx,cy,rx,ry])=>
    `<ellipse class="hit" cx="${imgX+cx}" cy="${imgY+cy}" rx="${rx}" ry="${ry}"/>`
  ).join("");
  return `<g id="${groupId}"><g class="hot cell-photo-part" data-o="${id}" tabindex="0" role="button" aria-label="${ORG[id].n}">${hits}</g></g>`;
}
function cellPhotoRect(id,x,y,w,h,rx=8){
  return `<g class="hot cell-photo-part" data-o="${id}" tabindex="0" role="button" aria-label="${ORG[id].n}">`+
    `<rect class="hit" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"/>`+
    `<rect class="ring" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"/></g>`;
}
function cellPhotoLabel(id,label,tx,ty,anchor,targetX,targetY){
  const n=ORG[id]&&ORG[id].no;
  const dot=n?numDot(anchor==="end"?tx+15:tx-15,ty-4.5,n):"";
  const dotSide=anchor==="start"?"left":"right";
  return `<g class="hot tag-label cell-photo-label" data-o="${id}" data-dot-side="${dotSide}" tabindex="0" role="button" aria-label="${label}">`+
    `<path class="lead" d="M${tx} ${ty} L${targetX} ${targetY}" fill="none"/>${dot}`+
    `<text class="cap" x="${tx}" y="${ty}" text-anchor="${anchor}">${label}</text>`+
    `<rect class="hit" x="${tx-2}" y="${ty-14}" width="4" height="20"/>`+
    `<rect class="ring" x="${tx-2}" y="${ty-14}" width="4" height="20" rx="5"/></g>`;
}
function fitCellPhotoLabels(root){
  root.querySelectorAll(".tag-label").forEach(g=>{
    const label=g.querySelector(".cap"), hit=g.querySelector("rect.hit");
    const ring=g.querySelector("rect.ring"), lead=g.querySelector(".lead");
    if(!label||!hit||!ring) return;
    const box=label.getBBox(), padX=8, padY=5;
    const attrs={x:box.x-padX,y:box.y-padY,width:box.width+padX*2,height:box.height+padY*2};
    [hit,ring].forEach(rect=>Object.entries(attrs).forEach(([name,value])=>rect.setAttribute(name,value)));
    const leadBox={...attrs};
    const dot=g.querySelector(".numdot");
    if(dot){
      const dotX=g.dataset.dotSide==="left"?attrs.x-15:attrs.x+attrs.width+15;
      const dotY=attrs.y+attrs.height/2;
      const circle=dot.querySelector("circle"), text=dot.querySelector("text");
      circle.setAttribute("cx",dotX); circle.setAttribute("cy",dotY);
      text.setAttribute("x",dotX); text.setAttribute("y",dotY+3.8);
      const left=Math.min(leadBox.x,dotX-9.5), right=Math.max(leadBox.x+leadBox.width,dotX+9.5);
      const top=Math.min(leadBox.y,dotY-9.5), bottom=Math.max(leadBox.y+leadBox.height,dotY+9.5);
      leadBox.x=left; leadBox.y=top; leadBox.width=right-left; leadBox.height=bottom-top;
    }
    if(!lead) return;
    const end=lead.getPointAtLength(lead.getTotalLength());
    const cx=leadBox.x+leadBox.width/2, cy=leadBox.y+leadBox.height/2;
    const dx=end.x-cx, dy=end.y-cy;
    if(!dx&&!dy) return;
    const tx=dx?leadBox.width/(2*Math.abs(dx)):Infinity;
    const ty=dy?leadBox.height/(2*Math.abs(dy)):Infinity;
    const t=Math.min(tx,ty), gap=4/Math.hypot(dx,dy);
    lead.setAttribute("d",`M${cx+dx*(t+gap)} ${cy+dy*(t+gap)} L${end.x} ${end.y}`);
  });
}
// 여러 세부 명칭을 하나로 묶는 대괄호 (교과서의 핵, 소포체 라벨 방식)
function bracket(x,y1,y2,dir=1){
  const t=8*dir;
  return `<path d="M${x-t} ${y1} L${x} ${y1} L${x} ${y2} L${x-t} ${y2}" fill="none" stroke="var(--ink3)" stroke-width="1.2"/>`;
}

/* ---------- 소기관 그리기 ---------- */
// 핵: 구를 4분의 1 잘라내 핵막, 염색질, 인이 드러나게 한다 (교과서 절개도 방식)
function drawNucleus(cx,cy,r){
  const P=(a,rr)=>[cx+Math.cos(a*Math.PI/180)*rr, cy+Math.sin(a*Math.PI/180)*rr];
  const [x0,y0]=P(-90,r), [x1,y1]=P(6,r);
  let s=`<g filter="url(#sh)">`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#gNucS)"/>`;
  // 잘려 나간 부분 = 핵 내부
  s+=`<path d="M${cx} ${cy} L${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z" fill="url(#gNucC)"/>`;
  // 인 (핵소체)
  s+=`<circle cx="${cx+r*.34}" cy="${cy-r*.4}" r="${r*.26}" fill="url(#gNuclo)"/>`;
  // 염색질: 잘린 면에 드러난 실 모양
  s+=`<g stroke="#9F81CE" stroke-width="${Math.max(1.4,r*.022)}" fill="none" opacity=".7" stroke-linecap="round">`;
  s+=`<path d="M${cx+r*.08} ${cy-r*.78} q${r*.18} ${r*.16} ${r*.02} ${r*.3} q${-r*.16} ${r*.14} ${r*.06} ${r*.28}"/>`;
  s+=`<path d="M${cx+r*.5} ${cy-r*.06} q${r*.16} ${-r*.18} ${r*.3} ${-r*.06}"/>`;
  s+=`<path d="M${cx+r*.2} ${cy-r*.2} q${r*.22} ${r*.1} ${r*.16} ${-r*.16}"/>`;
  s+=`</g>`;
  // 잘린 면의 핵막 (2중막) 단면
  s+=`<path d="M${cx} ${cy} L${x0.toFixed(1)} ${y0.toFixed(1)}" stroke="#D9C6F0" stroke-width="3.4"/>`;
  s+=`<path d="M${cx} ${cy} L${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="#D9C6F0" stroke-width="3.4"/>`;
  s+=`<path d="M${cx} ${cy} L${x0.toFixed(1)} ${y0.toFixed(1)}" stroke="#7B5BA8" stroke-width="1" stroke-dasharray="1 3"/>`;
  // 바깥 표면: 핵막과 핵공, 그리고 핵막에 붙은 라이보솜
  s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#3F2A66" stroke-width="1.6"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${r-5}" fill="none" stroke="#8E6FC0" stroke-width="1.4" opacity=".7"/>`;
  for(let i=0;i<22;i++){
    const a=8+i*16; if(a>-92&&a<8) continue;
    const [px,py]=P(a,r-2.5);
    s+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${Math.max(1.8,r*.03)}" fill="url(#gRibo)"/>`;
  }
  for(let i=0;i<7;i++){
    const a=20+i*22;
    const [ax,ay]=P(a,r-9), [bx,by]=P(a+5,r-9);
    s+=`<path d="M${ax.toFixed(1)} ${ay.toFixed(1)} L${bx.toFixed(1)} ${by.toFixed(1)}" stroke="#2E1B4D" stroke-width="2.6" opacity=".55" stroke-linecap="round"/>`;
  }
  s+=`</g>`;
  return s;
}
// 마이토콘드리아: 2중막과 크리스타. 교과서처럼 진한 적갈색.
function drawMito(cx,cy,rot=0,sc=1){
  const w=84*sc,h=46*sc;
  let s=`<g transform="translate(${cx} ${cy}) rotate(${rot})" filter="url(#shS)">`;
  s+=`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${h/2}" fill="url(#gMito)" stroke="#4E1220" stroke-width="1.4"/>`;
  s+=`<rect x="${-w/2+4.5}" y="${-h/2+4.5}" width="${w-9}" height="${h-9}" rx="${(h-9)/2}" fill="url(#gMitoIn)" stroke="#8E2D3B" stroke-width="1.1"/>`;
  for(let i=-2;i<=2;i++){
    const x=i*(w/6.2);
    s+=`<path d="M${x} ${-h/2+4.5} q${10*sc} ${h*.26} 0 ${h*.44} q${-10*sc} ${h*.2} 0 ${h*.26}" fill="none" stroke="#8E2D3B" stroke-width="${2*sc}" stroke-linecap="round"/>`;
  }
  s+=`<ellipse cx="${-w*.16}" cy="${-h*.3}" rx="${w*.2}" ry="${h*.1}" fill="#fff" opacity=".28"/>`;
  s+=`</g>`;
  return s;
}
// 엽록체: 2중막, 그라나(타이라코이드 더미), 스트로마
function drawChloro(cx,cy,rot=0,sc=1){
  const w=98*sc,h=54*sc;
  let s=`<g transform="translate(${cx} ${cy}) rotate(${rot})" filter="url(#shS)">`;
  s+=`<ellipse rx="${w/2}" ry="${h/2}" fill="url(#gChl)" stroke="#274A15" stroke-width="1.4"/>`;
  s+=`<ellipse rx="${w/2-4}" ry="${h/2-4}" fill="url(#gChlIn)" stroke="#3F6E28" stroke-width="1"/>`;
  [[-28,-5],[-5,7],[19,-7],[32,7]].forEach(([gx,gy])=>{
    for(let i=0;i<5;i++)
      s+=`<rect x="${(gx-9.5)*sc}" y="${(gy-9+i*4.2)*sc}" width="${19*sc}" height="${3*sc}" rx="${1.5*sc}" fill="#3F7A26" stroke="#274A15" stroke-width=".6"/>`;
  });
  s+=`<path d="M${-24*sc} ${-1*sc} q${20*sc} ${9*sc} ${44*sc} ${-5*sc}" fill="none" stroke="#4F8A32" stroke-width="1.6" opacity=".85"/>`;
  s+=`<ellipse cx="${-w*.18}" cy="${-h*.3}" rx="${w*.16}" ry="${h*.09}" fill="#fff" opacity=".3"/>`;
  s+=`</g>`;
  return s;

// 골지체: 납작한 주머니가 겹쳐 쌓인 구조 + 소낭. 교과서처럼 청록색.
function drawGolgi(cx,cy,rot=0,sc=1){
  let s=`<g transform="translate(${cx} ${cy}) rotate(${rot})" filter="url(#shS)">`;
  for(let i=0;i<5;i++){
    const y=(i*13-26)*sc, wq=(48-Math.abs(i-2)*5)*sc;
    s+=`<path d="M${-wq} ${y} q${wq} ${-10*sc} ${wq*2} 0 q${-wq} ${8*sc} ${-wq*2} 0 z" fill="url(#gGolgi)" stroke="#1F6862" stroke-width="1.3"/>`;
    s+=`<path d="M${-wq*.8} ${y-1.5*sc} q${wq*.8} ${-6*sc} ${wq*1.6} 0" fill="none" stroke="#B6EAE4" stroke-width="${1.2*sc}" opacity=".6"/>`;
  }
  [[-60,-30,5.5],[64,-18,6.5],[-66,10,5],[68,22,7],[-52,34,4.5]].forEach(([vx,vy,vr])=>
    s+=`<circle cx="${vx*sc}" cy="${vy*sc}" r="${vr*sc}" fill="url(#gGolgiV)" stroke="#1F6862" stroke-width="1"/>`);
  s+=`</g>`;
  return s;
}
// 거친면소포체: 라이보솜(주황 점)이 붙은 납작한 주머니
function drawRER(path,dots){
  let s=`<g filter="url(#shS)"><path d="${path}" fill="url(#gER)" stroke="#5B4483" stroke-width="1.6"/>`;
  dots.forEach(([x,y])=>s+=`<circle cx="${x}" cy="${y}" r="3.6" fill="url(#gRibo)" stroke="#A85A24" stroke-width=".5"/>`);
  s+=`</g>`;
  return s;
}
// 매끈면소포체: 라이보솜이 없는 관 모양
function drawSER(path){
  return `<g filter="url(#shS)"><path d="${path}" fill="none" stroke="#A56A2E" stroke-width="11" stroke-linecap="round"/>`+
         `<path d="${path}" fill="none" stroke="url(#gSER)" stroke-width="7.5" stroke-linecap="round"/>`+
         `<path d="${path}" fill="none" stroke="#F7DEB8" stroke-width="2" stroke-linecap="round" opacity=".55"/></g>`;
}
// 라이소솜: 단일막 주머니 + 가수분해 효소
function drawLyso(cx,cy,r=17){
  let s=`<g filter="url(#shS)"><circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#gLyso)" stroke="#7A2854" stroke-width="1.4"/>`;
  [[-.35,-.3],[.3,-.35],[0,.1],[-.3,.4],[.4,.3]].forEach(([dx,dy])=>
    s+=`<circle cx="${cx+dx*r}" cy="${cy+dy*r}" r="${r*.12}" fill="#4E1533" opacity=".8"/>`);
  s+=`<ellipse cx="${cx-r*.3}" cy="${cy-r*.42}" rx="${r*.3}" ry="${r*.16}" fill="#fff" opacity=".4"/></g>`;
  return s;
}
// 중심체: 중심립 2개가 직각으로 배열
function drawCentro(cx,cy){
  const barrel=(x,y,rot)=>{
    let g=`<g transform="translate(${x} ${y}) rotate(${rot})">`;
    g+=`<rect x="-25" y="-11.5" width="50" height="23" rx="3.5" fill="url(#gCent)" stroke="#1F556B" stroke-width="1.4"/>`;
    for(let i=-2;i<=2;i++) g+=`<line x1="${i*9.2}" y1="-11.5" x2="${i*9.2}" y2="11.5" stroke="#1F556B" stroke-width="1.2" opacity=".8"/>`;
    g+=`<rect x="-25" y="-11.5" width="50" height="7" rx="3" fill="#fff" opacity=".22"/>`;
    g+=`</g>`; return g;
  };
  return `<g filter="url(#shS)">${barrel(cx-14,cy+12,0)}${barrel(cx+16,cy-12,90)}</g>`;
}
// 라이보솜: 대단위체와 소단위체 (막이 없다). 교과서처럼 주황 알갱이.
function drawRibo(cx,cy,sc=1){
  return `<g><ellipse cx="${cx}" cy="${cy-1.6*sc}" rx="${5.2*sc}" ry="${3.6*sc}" fill="url(#gRibo)" stroke="#A85A24" stroke-width=".6"/>`+
    `<ellipse cx="${cx}" cy="${cy+2.4*sc}" rx="${4*sc}" ry="${2.4*sc}" fill="#D9873F" stroke="#A85A24" stroke-width=".5"/></g>`;
}
// 액포: 단일막. 성숙한 식물세포에서는 크게 발달한다.
function drawVac(path,label){
  return `<g><path d="${path}" fill="url(#gVac)" stroke="#7FA868" stroke-width="2.4" opacity=".95"/>`+
         `<path d="${path}" fill="none" stroke="#fff" stroke-width="1.2" opacity=".7" transform="translate(0 3)"/></g>`;
}
// 세포골격: 가는 단백질 섬유
function drawSkel(lines,op=.55){
  return `<g opacity="${op}" stroke="#7FB35E" fill="none" stroke-linecap="round">`+
    lines.map(([d,w])=>`<path d="${d}" stroke-width="${w||1.6}"/>`).join("")+`</g>`;
}

const ORDER=["memb","nucleus","er","ribo","golgi","cent","mito","lyso","skel","vac","chloro","wall"];

const ANIMAL_VAC={
  ...ORG.vac,
  r:"매우 작고 눈에 잘 띄지 않음.",
  d:[["동물세포의 액포","소낭 형태로 일시적으로 존재하며, 물질의 일시적 저장, 영양분이나 노폐물의 운반 및 소화 보조에 관여한다."]],
  adv:""
};

/* ---------- 정보 패널 ---------- */
function yn(v){ return v===1?["있음","y"]:v===2?["작게 있음","b"]:["없음","n"]; }
function showOrg(id){
  if(!id){ $("#info").innerHTML=`<p class="hint">도식에서 <b>세포소기관이나 그 이름표</b>를 누르면 구조와 기능이 여기에 나타납니다.</p>`; return; }
  const o=(id==="vac" && state.view==="eu-an")?ANIMAL_VAC:ORG[id]; let h="";
  h+=`<div class="ph"><span class="swatch" style="background:${o.c}"></span>${o.n}</div>`;
  if(o.r) h+=`<div style="font-size:12.5px;color:var(--ink3);margin-bottom:9px">${o.r}</div>`;
  const [pt,pc]=yn(o.p),[at,ac]=yn(o.a),[lt,lc]=yn(o.l);
  h+=`<div class="tags"><span class="tg ${pc}">원핵세포 ${pt}</span><span class="tg ${ac}">동물세포 ${at}</span><span class="tg ${lc}">식물세포 ${lt}</span></div>`;
  h+=`<dl>`+(o.d||[]).map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")+`</dl>`;
  if(o.adv) h+=`<div class="adv adv-only"><b>심화</b> ${o.adv}</div>`;
  $("#info").innerHTML=h;
}
function bindHots(root){
  root.querySelectorAll(".hot").forEach(g=>{
    const act=()=>{
      root.querySelectorAll(".hot.sel").forEach(x=>x.classList.remove("sel"));
      root.querySelectorAll(".hot").forEach(x=>{
        if(x.dataset.o===g.dataset.o) x.classList.add("sel");
      });
      // onPick은 init()에서 지정되므로 반드시 클릭 시점에 읽어야 한다.
      const f=VIEW[state.view] && VIEW[state.view].onPick;
      if(f && f(g.dataset.o)===false) return;
      showOrg(g.dataset.o);
    };
    g.addEventListener("click",act);
    g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();act();} });
  });
}

/* ---------- 범례 / 퀴즈 / 요약 ---------- */
function setLegend(ids){
  $("#legend").innerHTML=ids.map(k=>{
    const o=ORG[k]; const full=o.n.length>6?" full":"";
    return `<div class="lg${full}"><i style="background:${o.c}"></i><span>${o.n}</span></div>`;
  }).join("");
}
function setQuiz(q,title){
  const p=$("#quizPanel");
  if(!q){ p.hidden=true; return; }
  p.hidden=false; $("#quizTitle").textContent=title||"확인 질문";
  $("#quiz").innerHTML=`<div class="q">${q.q}</div><div class="qopts">`+
    q.o.map((t,i)=>`<button class="qopt" data-i="${i}">${t}</button>`).join("")+`</div><div class="qfb" id="qfb"></div>`;
  $("#quiz").querySelectorAll(".qopt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    $("#quiz").querySelectorAll(".qopt").forEach(x=>x.disabled=true);
    b.classList.add(i===q.a?"ok":"no");
    if(i!==q.a) $("#quiz").querySelector(`.qopt[data-i="${q.a}"]`).classList.add("ok");
    const fb=$("#qfb"); fb.innerHTML=q.e; fb.classList.add("show");
  });
}
function summary(title,sub,items,extra){
  $("#mcard").innerHTML=`<h3>${title}</h3><div class="sub">${sub}</div>`+
    `<ul>${items.map(i=>`<li>${i}</li>`).join("")}</ul>`+(extra||"")+
    `<button class="btn primary mclose" id="mclose">닫기</button>`;
  $("#modal").classList.add("open");
  $("#mclose").onclick=()=>$("#modal").classList.remove("open");
}
$("#modal").addEventListener("click",e=>{ if(e.target.id==="modal") $("#modal").classList.remove("open"); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") $("#modal").classList.remove("open"); });

/* ---------- 라우터 ---------- */
const SUB={
  pk:[["pk-cmp","원핵세포와 진핵세포"],["pk-one","원핵세포 자세히"]],
  eu:[["eu-an","동물세포"],["eu-pl","식물세포"],["eu-cmp","동물세포와 식물세포 비교"],["eu-id","세포 구별하기"]]
};
const VIEW={};
let state={main:"pk",view:"pk-cmp",adv:false};
function renderSubtabs(){
  $("#subtabs").innerHTML=SUB[state.main].map(([id,t])=>
    `<button role="tab" data-view="${id}" aria-selected="${id===state.view}">${t}</button>`).join("");
  $("#subtabs").querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.view));
}
function go(view){
  const main=view.startsWith("pk")?"pk":"eu";
  state.main=main; state.view=view;
  $$("#maintabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.main===main));
  renderSubtabs();
  const v=VIEW[view];
  $("#viewTitle").textContent=v.title;
  $("#viewSub").textContent=v.sub||"";
  $("#ctrl").innerHTML=typeof v.ctrl==="function"?v.ctrl():(v.ctrl||"");
  $("#stage").innerHTML=`<svg viewBox="${v.vb}" role="img" aria-label="${v.title} 도식">${defs()}${v.svg()}</svg>`;
  const stageSvg=$("#stage").querySelector("svg");
  fitCellPhotoLabels(stageSvg);
  setLegend(v.legend||[]);
  setQuiz(v.quiz||null,v.quizTitle);
  showOrg(null);
  bindHots($("#stage"));
  if(v.init) v.init(stageSvg);
  window.scrollTo({top:0,behavior:"smooth"});
}
$$("#maintabs button").forEach(b=>b.onclick=()=>go(SUB[b.dataset.main][0][0]));
function advToggle(id){
  const el=$("#"+id); if(!el) return;
  el.checked=state.adv;
  el.onchange=()=>{ state.adv=el.checked; document.body.classList.toggle("adv",state.adv); };
  document.body.classList.toggle("adv",state.adv);
}
</script>
<script>
/* ============================================================
   원핵세포와 진핵세포 비교 탭
   ============================================================ */
// 원핵세포 (막대 모양 세균) 도식
function prokCell(x,y,w,h,ids){
  const r=h/2;
  let s=`<g>`;
  s+=`<g id="${ids}Wall"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="url(#wallTex)" stroke="var(--wall2)" stroke-width="2"/></g>`;
  s+=`<g id="${ids}Memb"><rect x="${x+11}" y="${y+11}" width="${w-22}" height="${h-22}" rx="${r-11}" fill="none" stroke="var(--memb)" stroke-width="4.5"/></g>`;
  s+=`<rect x="${x+15}" y="${y+15}" width="${w-30}" height="${h-30}" rx="${r-15}" fill="var(--cyto)"/>`;
  // 핵양체: 막이 없는 DNA 뭉치
  const cx=x+w/2, cy=y+h/2;
  s+=`<g id="${ids}DNA"><path d="M${cx-64} ${cy} q22 -30 44 -6 q22 24 44 -6 q22 -28 42 4 q-18 34 -42 10 q-24 -22 -44 6 q-22 26 -44 -8 z"
      fill="none" stroke="var(--nuc2)" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M${cx-52} ${cy+14} q26 22 52 -2 q26 -22 48 6" fill="none" stroke="var(--nuc2)" stroke-width="3.2" stroke-linecap="round"/></g>`;
  // 라이보솜: 원핵세포에도 있다
  s+=`<g id="${ids}Ribo">`;
  const pts=[[-100,-42],[-72,-52],[-40,-46],[-8,-54],[26,-46],[62,-52],[96,-40],[-108,-14],[108,-12],
             [-100,44],[-70,52],[-36,44],[-4,54],[30,46],[64,52],[98,42],[-114,16],[112,18],[-56,-24],[56,24]];
  pts.forEach(([dx,dy])=>s+=drawRibo(cx+dx,cy+dy,.9));
  s+=`</g>`;

function eukCell(cx,cy,ids){
  let s=`<g>`;
  const blob=`M${cx} ${cy-196} C${cx+118} ${cy-196} ${cx+196} ${cy-118} ${cx+196} ${cy}
              C${cx+196} ${cy+118} ${cx+118} ${cy+196} ${cx} ${cy+196}
              C${cx-118} ${cy+196} ${cx-196} ${cy+118} ${cx-196} ${cy}
              C${cx-196} ${cy-118} ${cx-118} ${cy-196} ${cx} ${cy-196} Z`;
  s+=`<path d="${blob}" fill="var(--cyto)"/>`;
  s+=`<g id="${ids}Memb"><path d="${blob}" fill="none" stroke="var(--memb)" stroke-width="5"/></g>`;
  s+=`<g id="${ids}Skel">${drawSkel([
      [`M${cx-150} ${cy-90} q80 60 170 30 q70 -24 130 40`],[`M${cx-120} ${cy+120} q90 -70 190 -30 q60 24 100 -60`],
      [`M${cx-40} ${cy-170} q30 130 -20 200`],[`M${cx+90} ${cy-150} q-40 140 30 190`]],.42)}</g>`;
  s+=`<g id="${ids}Nuc">${drawNucleus(cx-52,cy-38,74)}</g>`;
  s+=`<g id="${ids}ER">${drawRER(`M${cx+18} ${cy-96} q54 -20 92 8 q-40 20 -84 12 q46 12 78 40 q-46 12 -84 -14 q40 26 66 56 q-52 6 -80 -30 z`,
      [[cx+50,cy-104],[cx+86,cy-90],[cx+66,cy-58],[cx+96,cy-46],[cx+58,cy-20],[cx+88,cy-8],[cx+30,cy-72],[cx+24,cy-24]])}</g>`;
  s+=`<g id="${ids}Golgi">${drawGolgi(cx+16,cy+118,-8,.62)}</g>`;
  s+=`<g id="${ids}Mito">${drawMito(cx-118,cy+112,-24,.82)}${drawMito(cx+126,cy+16,64,.82)}</g>`;
  s+=`<g id="${ids}Ribo">`;
  [[-160,-96],[-140,60],[-96,150],[-14,168],[70,150],[150,86],[164,-70],[110,-140],[20,-160],[-70,-146],[-172,-16],[176,-4],[-46,86],[54,64]]
    .forEach(([dx,dy])=>s+=drawRibo(cx+dx,cy+dy,1));
  s+=`</g>`;
  s+=`</g>`;
  return s;
}

/* 찾기 모드: 학생이 이름을 보고 도식에서 직접 찾아 누른다 */
function makeFinder(list,label){
  const F={on:false,queue:[],cur:null,ok:0,miss:0};
  const P=$("#quizPanel"), T=$("#quizTitle"), B=$("#quiz");
  function paint(){
    if(!F.on){ return; }
    T.textContent="찾기 모드";
    if(!F.cur){
      B.innerHTML=`<div class="q">${label} 소기관 ${list.length}개를 모두 찾았습니다.</div>
        <p class="hint" style="margin-bottom:10px">맞힘 ${F.ok}개 / 틀림 ${F.miss}개</p>
        <button class="btn primary" id="fnAgain">다시 하기</button>`;
      $("#fnAgain").onclick=()=>{ start(); };
      return;
    }
    B.innerHTML=`<div class="q">도식에서 <span style="color:var(--orange)">${ORG[F.cur].n}</span>을(를) 찾아 누르세요.</div>
      <p class="hint">남은 개수 ${F.queue.length+1}개, 맞힘 ${F.ok}, 틀림 ${F.miss}</p>
      <div class="qfb show" id="fnFb"></div>`;
  }
  function start(){
    F.queue=list.slice().sort(()=>Math.random()-.5);
    F.ok=0; F.miss=0; F.cur=F.queue.shift(); paint();
  }
  function check(id){
    if(!F.on||!F.cur) return true;
    const fb=$("#fnFb");
    if(id===F.cur){
      F.ok++;
      if(fb){ fb.innerHTML=`<b style="color:#2f5b28">정답입니다.</b> ${ORG[F.cur].n} — ${ORG[F.cur].r}`; }
      setTimeout(()=>{ F.cur=F.queue.length?F.queue.shift():null; paint(); },900);
    } else {
      F.miss++;
      if(fb) fb.innerHTML=`<b style="color:#8c3226">${ORG[id]?ORG[id].n:"그것"}은(는) 아닙니다.</b> 다시 찾아보세요.`;
    }
    return false;
  }
  return {F,start,check,paint,
    toggle(on){ F.on=on; if(on){ P.hidden=false; start(); } }};
}

  init(svg){
    const A={memb:"cAMemb",nucleus:"cANuc",er:"cAER",ribo:"cARibo",golgi:"cAGolgi",mito:"cAMito",
             skel:"cASkel",cent:"cACent",lyso:"cALyso",vac:"cAVac"};
    const L={memb:"cLMemb",nucleus:"cLNuc",er:"cLER",ribo:"cLRibo",golgi:"cLGolgi",mito:"cLMito",
             skel:"cLSkel",wall:"cLWall",chloro:"cLChloro",vac:"cLVac"};
    const SAME=["memb","nucleus","er","ribo","golgi","mito","skel"];
    const ALL=[...new Set([...Object.values(A),...Object.values(L)])];
    const MODE={
      all:{on:ALL,t:"",s:""},
      same:{on:[...SAME.map(k=>A[k]),...SAME.map(k=>L[k])],
        t:"공통점: 세포막, 핵, 소포체, 라이보솜, 골지체, 마이토콘드리아, 세포골격",
        s:"두 세포가 가진 것의 대부분은 같다. 특히 마이토콘드리아는 식물세포에도 반드시 있다."},
      an:{on:[A.cent,A.lyso],
        t:"동물세포에만: 중심체, 발달한 라이소솜",
        s:"중심체는 방추사를 만들고, 라이소솜은 세포내 소화를 한다. 식물세포는 라이소솜 역할을 액포가 대신한다."},
      pl:{on:[L.wall,L.chloro,L.vac],
        t:"식물세포에만: 세포벽, 엽록체, 크게 발달한 액포",
        s:"이 셋 중 하나라도 보이면 식물세포다. 동물세포를 판정하는 가장 빠른 방법이기도 하다."}
    };
    function set(m){
      const M=MODE[m];
      ALL.forEach(id=>{ const e=svg.querySelector("#"+id); if(!e) return;
        e.classList.remove("pulse","soft");
        if(m!=="all"){ M.on.includes(id)?e.classList.add("pulse"):e.classList.add("soft"); }});
      const B=svg.querySelector("#cmpBan");
      B.classList.toggle("hide",m==="all");
      svg.querySelector("#cmpBt").textContent=M.t;
      svg.querySelector("#cmpBs").textContent=M.s;
      $$("#cmpF button").forEach(b=>b.setAttribute("aria-selected",b.dataset.f===m));
    }
    $$("#cmpF button").forEach(b=>b.onclick=()=>set(b.dataset.f));
    $("#cmpTbl").onclick=()=>summary("동물세포와 식물세포 비교표","포함 여부와 하는 일",[],CMP_TABLE);
    $("#cmpSum").onclick=()=>summary("동물세포와 식물세포","핵심 정리",[
      "<b>같은 것</b>: 세포막, 핵, 소포체, 라이보솜, 골지체, 마이토콘드리아, 세포골격. 대부분이 같다.",
      "<b>식물세포에만</b>: <b>세포벽</b>, <b>엽록체</b>, <b>크게 발달한 액포</b>",
      "<b>동물세포에만</b>: <b>중심체</b>, <b>발달한 라이소솜</b>",
      "가장 흔한 오해는 <b>식물세포에 마이토콘드리아가 없다</b>고 생각하는 것이다. 식물도 세포호흡을 하므로 반드시 있다.",
      "액포는 동물세포에도 있지만 <b>아주 작다</b>. 크기 차이지 유무의 차이가 아니다.",
      "구별할 때는 <b>세포벽, 엽록체, 큰 액포</b>가 보이는지부터 확인하는 것이 가장 빠르다.",

    ],CMP_TABLE);
    set("all");
  }
};

  init(svg){

      IDQ.forEach(q=>q.clue.forEach(id=>{ const e=svg.querySelector("#"+id); if(e) e.classList.toggle("pulse",on); }));

      const S=svg.querySelector("#idSel"), R=svg.querySelector("#idSelR");

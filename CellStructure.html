<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세포의 구조와 세포소기관</title>
<style>
:root{
  --paper:#FAF7F0; --card:#FFFFFF;
  --ink:#25231E; --ink2:#5E584D; --ink3:#918977;
  --rule:#E0D8C7; --rule2:#CFC5AE;

  --cyto:#F6F1E2;          /* 세포질 */
  --cyto2:#EFE8D4;
  --memb:#58A9D8;          /* 세포막 */
  --memb2:#2E6C96;
  --wall:#7BA83E;          /* 세포벽 */
  --wall2:#4E7223;
  --nuc:#7B5BA8;           /* 핵 */
  --nuc2:#3F2A66;
  --nucleolus:#2E1B4D;
  --er:#8B6FB5;            /* 소포체 */
  --er2:#5B4483;
  --golgi:#3F9E96;         /* 골지체 */
  --golgi2:#1F6862;
  --mito:#A03A48;          /* 마이토콘드리아 */
  --mito2:#5E1826;
  --lyso:#C4548E;          /* 라이소솜 */
  --lyso2:#8A2F5F;
  --chloro:#4F8A32;        /* 엽록체 */
  --chloro2:#2C5119;
  --vac:#DDEBD4;           /* 액포 */
  --vac2:#7FA868;
  --cent:#4E9CB5;          /* 중심체 */
  --cent2:#266479;
  --skel:#7FB35E;          /* 세포골격 */
  --ribo:#E8963C;          /* 라이보솜 */
  --magenta:#BE3487;
  --blue:#3A7BC0; --blue-soft:#D3E3F4;
  --orange:#DE7A2C; --orange-soft:#F9DCC0;
  --green-soft:#DDEDD4; --purple-soft:#E6DCF4;
  --red:#C0392B;

  --sans:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR","Nanum Gothic",sans-serif;
  --serif:"Times New Roman","Nanum Myeongjo",Batang,"Batang",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}

header{border-bottom:1px solid var(--rule2);background:var(--paper);position:sticky;top:0;z-index:40}
.hbar{max-width:1560px;margin:0 auto;padding:14px 22px 0;display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;padding-bottom:12px}
.brand h1{font-size:19px;font-weight:800;letter-spacing:-.03em}
.brand span{font-size:12px;color:var(--ink3);letter-spacing:.06em}
.maintabs{display:flex;gap:6px;margin-left:auto}
.maintabs button{
  font-family:inherit;font-size:15px;font-weight:700;letter-spacing:-.02em;
  border:1px solid var(--rule2);border-bottom:none;background:#F2ECE0;color:var(--ink2);
  padding:10px 24px;border-radius:9px 9px 0 0;cursor:pointer;position:relative;top:1px;transition:background .15s,color .15s}
.maintabs button:hover{background:#EAE2D2}
.maintabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 -3px 0 0 var(--orange) inset}
.subbar{border-top:1px solid var(--rule2);background:#F6F1E6}
.subtabs{max-width:1560px;margin:0 auto;padding:0 22px;display:flex;gap:2px;flex-wrap:wrap}
.subtabs button{
  font-family:inherit;font-size:13.5px;font-weight:600;border:none;background:none;color:var(--ink3);
  padding:11px 16px;cursor:pointer;border-bottom:3px solid transparent;letter-spacing:-.02em;transition:color .15s}
.subtabs button:hover{color:var(--ink2)}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--orange)}

main{max-width:1560px;margin:0 auto;padding:20px 22px 8px;display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:20px;align-items:start}
.stage-col{min-width:0}
.stagehead{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.stagehead h2{font-size:17px;font-weight:800;letter-spacing:-.03em}
.stagehead p{font-size:12.5px;color:var(--ink3)}
.stage{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:8px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}

.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.btn{font-family:inherit;font-size:13px;font-weight:700;letter-spacing:-.02em;border:1px solid var(--rule2);
  background:var(--card);color:var(--ink);padding:8px 14px;border-radius:7px;cursor:pointer;transition:.15s}
.btn:hover{background:#F4EFE4}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#3b3830}
.btn:disabled{opacity:.38;cursor:default}
.btn[aria-pressed="true"]{background:var(--orange);border-color:#b8601a;color:#fff}
.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:7px;overflow:hidden}
.seg button{font-family:inherit;font-size:13px;font-weight:700;border:none;background:var(--card);color:var(--ink2);
  padding:8px 13px;cursor:pointer;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:none}
.seg button[aria-selected="true"]{background:var(--ink);color:#fff}
.seg.warm button[aria-selected="true"]{background:var(--orange);color:#fff}
.tog{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink2);
  border:1px solid var(--rule2);border-radius:7px;padding:7px 12px;cursor:pointer;background:var(--card);user-select:none}
.tog input{accent-color:var(--orange);width:14px;height:14px;cursor:pointer}
.spacer{flex:1}

aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:118px}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.panel > h3{font-size:11px;font-weight:800;letter-spacing:.13em;color:var(--ink3);
  padding:11px 14px 9px;border-bottom:1px solid var(--rule);background:#FCFAF5}
.pbody{padding:13px 14px 15px}
.pbody .ph{font-size:16px;font-weight:800;letter-spacing:-.03em;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.pbody .swatch{width:13px;height:13px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.25)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.tg{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:#EFEADC;color:var(--ink2)}
.tg.y{background:#DDEDD4;color:#3d6b2c}
.tg.n{background:#FBE4E0;color:#8c3226}
.tg.b{background:var(--blue-soft);color:#255183}
.pbody dl{font-size:13px;line-height:1.62}
.pbody dt{font-weight:700;color:var(--ink2);margin-top:9px;font-size:12px;letter-spacing:.02em}
.pbody dd{color:var(--ink2)}
.pbody .hint{color:var(--ink3);font-size:12.5px;line-height:1.6}
.pbody .adv{margin-top:11px;padding:9px 11px;border-radius:7px;background:#F6F2E8;border-left:3px solid var(--rule2);font-size:12.5px;color:var(--ink2)}
.pbody .adv b{color:var(--ink);font-weight:800}

.legend{padding:11px 13px 13px;display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}
.lg{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink2);font-weight:600}
.lg i{width:13px;height:13px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.22)}
.lg.full{grid-column:1/-1}

.quiz{padding:13px 14px 15px}
.quiz .q{font-size:13.5px;font-weight:700;line-height:1.55;margin-bottom:10px}
.qopts{display:flex;flex-direction:column;gap:6px}
.qopt{font-family:inherit;text-align:left;font-size:13px;font-weight:600;border:1px solid var(--rule2);
  background:var(--card);color:var(--ink2);padding:8px 11px;border-radius:7px;cursor:pointer;transition:.12s}
.qopt:hover{border-color:var(--ink3);background:#FBF8F1}
.qopt.ok{background:#E3F2E0;border-color:#7CB36E;color:#2f5b28}
.qopt.no{background:#FBE4E0;border-color:#D89187;color:#8c3226}
.qfb{margin-top:10px;font-size:12.5px;line-height:1.6;color:var(--ink2);display:none}
.qfb.show{display:block}

.modal{position:fixed;inset:0;background:rgba(38,35,30,.55);z-index:80;display:none;align-items:center;justify-content:center;padding:24px}
.modal.open{display:flex}
.mcard{background:var(--card);border-radius:14px;max-width:760px;width:100%;max-height:86vh;overflow:auto;padding:26px 28px 24px}
.mcard h3{font-size:19px;font-weight:800;letter-spacing:-.03em;margin-bottom:4px}
.mcard .sub{font-size:12px;color:var(--ink3);margin-bottom:16px}
.mcard ul{margin:0;padding-left:0;list-style:none}
.mcard li{font-size:13.5px;line-height:1.65;color:var(--ink2);padding:9px 0 9px 16px;border-top:1px solid var(--rule);position:relative}
.mcard li:before{content:"";position:absolute;left:0;top:17px;width:6px;height:6px;border-radius:50%;background:var(--orange)}
.mcard li b{color:var(--ink);font-weight:800}
.mclose{margin-top:18px}
table.cmp{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:6px}
table.cmp th,table.cmp td{border:1px solid var(--rule);padding:6px 9px;text-align:left}
table.cmp th{background:#F6F1E6;font-weight:700;font-size:11.5px}
table.cmp td.no{color:#a33;font-weight:700}
table.cmp td.yes{color:#2f6b3e;font-weight:700}
table.cmp td.mid{color:#8a6a12;font-weight:700}

footer{max-width:1560px;margin:16px auto 0;padding:16px 22px 26px;font-size:11.5px;color:var(--ink3);
  border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---- SVG 공통 ---- */
.hot{cursor:pointer}
.hot .hit{fill:transparent;stroke:none}
.hot .ring{fill:none;stroke:var(--orange);stroke-width:2.5;opacity:0;stroke-dasharray:4 4;transition:opacity .15s}
.hot:hover .ring{opacity:.9}
.hot.sel .ring{opacity:1;stroke-dasharray:none;stroke-width:3.4}
.hot .lead{stroke:var(--ink3);stroke-width:1}
.hot:hover .lead,.hot.sel .lead{stroke:var(--orange);stroke-width:1.6}
.hot .cap{font-weight:700}
.hot:hover .cap,.hot.sel .cap{fill:var(--orange)}
text{font-family:var(--sans)}
.f{font-family:var(--serif)}
.lbl{font-size:13px;font-weight:600;fill:var(--ink)}
.lbl-s{font-size:11.5px;font-weight:600;fill:var(--ink2)}
.lbl-xs{font-size:10.5px;font-weight:600;fill:var(--ink3)}
.zone{font-size:12.5px;font-weight:800;letter-spacing:-.02em}
.note{font-size:11.5px;font-weight:600;fill:var(--magenta)}
.dim{opacity:.14;transition:opacity .35s}
.soft{opacity:.32;transition:opacity .35s}
.hide{opacity:0;pointer-events:none}
.pulse{animation:pl 1.5s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.4}}
.flash{animation:fl .8s ease-out}
@keyframes fl{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.adv-only{display:none}
body.adv .adv-only{display:block}
@media (prefers-reduced-motion:reduce){.pulse,.flash{animation:none}*{transition-duration:.01ms !important}}
/* 태블릿: 머리말을 줄이고 세부 탭은 한 줄로 두어 옆으로 밀어 넘긴다 */
@media (max-width:1180px){
  .brand span{display:none}
  .subtabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .subtabs::-webkit-scrollbar{display:none}
  .subtabs button{white-space:nowrap;flex:none}
}
/* 가로 태블릿: 설명 패널을 도식 옆에 두어 누르자마자 보이게 한다 */
@media (min-width:900px) and (max-width:1180px){
  main{grid-template-columns:minmax(0,1fr) 300px;gap:16px}
  aside{top:110px}
}
@media (max-width:899px){main{grid-template-columns:1fr}aside{position:static;flex-direction:row;flex-wrap:wrap}aside > .panel{flex:1 1 300px}}
@media (max-width:640px){
  /* 휴대폰: 머리말이 화면을 가리지 않도록 고정을 풀고 한 줄로 줄인다 */
  header{position:static}
  .hbar{padding:8px 12px 0;gap:10px;flex-wrap:nowrap;align-items:center}
  .brand{padding-bottom:0;min-width:0}
  .brand h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .maintabs{margin-left:auto;flex:none;align-self:flex-end}
  .maintabs button{padding:7px 10px;font-size:12.5px}
  .subtabs{padding:0 6px}
  .subtabs button{padding:8px 9px;font-size:12px}
  main{padding:14px 12px}
}

/* ---- 새 도식: 소기관 그룹 전체가 눌린다 ---- */
.org{cursor:pointer;outline:none}
.org:hover{filter:brightness(1.08)}
.org.sel{filter:drop-shadow(0 0 3px #DE7A2C) drop-shadow(0 0 7px rgba(222,122,44,.75))}
.org:focus-visible{filter:drop-shadow(0 0 3px #3A7BC0)}
.org[data-o="ribo"] circle{stroke:transparent;stroke-width:10}
.noclick .org{pointer-events:none}
.hot .sub{fill:var(--ink2)}
.hot:hover .sub,.hot.sel .sub{fill:var(--orange)}
.tg.mem{background:#EDE6F5;color:#5B4483}
.qnext{margin-top:10px}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="brand">
      <h1>세포의 구조와 세포소기관</h1>
      <span>세포와 물질대사 인터랙티브 탐구</span>
    </div>
    <nav class="maintabs" id="maintabs" role="tablist">
      <button role="tab" data-main="pk" aria-selected="true">원핵세포와 진핵세포</button>
      <button role="tab" data-main="eu" aria-selected="false">진핵세포</button>
    </nav>
  </div>
  <div class="subbar"><nav class="subtabs" id="subtabs" role="tablist"></nav></div>
</header>

<main>
  <div class="stage-col">
    <div class="stagehead"><h2 id="viewTitle">—</h2><p id="viewSub"></p></div>
    <div class="ctrl" id="ctrl"></div>
    <div class="stage" id="stage"></div>
  </div>
  <aside>
    <div class="panel"><h3>세포소기관 설명</h3><div class="pbody" id="info"></div></div>
    <div class="panel" id="quizPanel" hidden><h3 id="quizTitle">확인 질문</h3><div class="quiz" id="quiz"></div></div>
    <div class="panel"><h3>범례</h3><div class="legend" id="legend"></div></div>
  </aside>
</main>

<footer>
  <span>ⓒ 이재빈, 광덕고등학교 세포와 물질대사</span>
  <span>도식은 각 소기관의 구조가 드러나도록 크기를 조정한 모식도입니다.</span>
</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="mcard" id="mcard"></div></div>

const ORG={
  memb:{n:"세포막",c:"#58A9D8",p:1,a:1,l:1,m:"인지질 이중층",r:"모든 세포의 경계",
    d:[["구조","인지질 이중층에 단백질이 군데군데 박혀 있다. 인지질과 단백질이 움직일 수 있어 유동 모자이크막이라 한다."],
       ["기능","세포 안팎을 구분하고, 어떤 물질을 얼마나 들여보낼지 <b>선택적으로 조절</b>한다."],
       ["어디에 있나","원핵세포, 동물세포, 식물세포 <b>모두</b>. 예외가 없다."],
       ["세포벽과의 차이","세포벽은 물질을 가리지 않고 통과시킨다(전투과성). 물질을 가려 받는 것은 세포막이다."]],
    adv:"인지질은 물과 친한 머리와 물을 싫어하는 꼬리를 함께 가진다. 그래서 물속에서 꼬리끼리 마주 보며 저절로 이중층을 이룬다."},

  nucleus:{n:"핵",c:"#9B5AB2",p:0,a:1,l:1,m:"이중막",r:"유전정보의 저장고",
    d:[["구조","<b>핵막</b>(이중막)으로 싸여 있고, 핵막에는 <b>핵공</b>이라는 구멍이 뚫려 있다. 안에는 <b>염색질</b>(DNA와 단백질)과 <b>인</b>이 있다."],
       ["기능","유전정보(DNA)를 보관하고 세포의 생명 활동을 조절한다."],
       ["핵공이 하는 일","mRNA처럼 큰 물질이 핵과 세포질을 드나드는 통로. DNA 자체는 핵 밖으로 나가지 않는다."],
       ["인","라이보솜을 만드는 재료(rRNA)가 합성되는 곳"],
       ["어디에 있나","진핵세포에만. <b>원핵세포에는 핵막이 없어</b> 유전물질(DNA)이 세포질에 그대로 놓여 있다."],
       ["자세히 보기","'핵 자세히' 탭에서 핵막과 핵공의 구조를 확대해 볼 수 있다."]],
    adv:"핵막의 외막은 거친면소포체와 이어져 있다. 그래서 외막 바깥면에도 라이보솜이 붙어 있다."},

  er:{n:"소포체",c:"#8D63AE",p:0,a:1,l:1,m:"단일막",r:"물질의 합성과 수송 통로",
    d:[["구조","막으로 된 납작한 주머니와 관이 서로 이어진 구조. <b>핵막과 연결</b>되어 있다."],
       ["거친면소포체","표면에 <b>라이보솜이 붙어 있어</b> 거칠어 보인다. 라이보솜이 만든 단백질이 주머니 안으로 들어가 가공되고, 이어진 통로를 따라 골지체로 보내진다."],
       ["매끈면소포체","라이보솜이 붙어 있지 않다. <b>지질을 합성</b>하고, 해로운 물질을 해독하며, 칼슘 이온을 저장한다."],
       ["어디에 있나","동물세포와 식물세포 모두. 원핵세포에는 없다."],
       ["구별 요령","도식에서 <b>점(라이보솜)이 붙어 있으면 거친면소포체</b>, 매끈하면 매끈면소포체다. 두 소포체는 서로 이어져 있다."]],
    adv:"간세포는 알코올과 약물을 해독해야 하므로 매끈면소포체가 특히 발달해 있다."},

  ribo:{n:"라이보솜",c:"#E8963C",p:1,a:1,l:1,m:"막 없음",r:"단백질을 만드는 공장",
    d:[["구조","<b>막이 없다.</b> rRNA와 단백질로 이루어진 큰 단위체와 작은 단위체가 합쳐진 알갱이."],
       ["기능","mRNA의 유전정보를 읽어 <b>단백질을 합성</b>한다."],
       ["어디에 있나","세포질에 떠 있거나 <b>거친면소포체 표면</b>에 붙어 있다."],
       ["중요","<b>원핵세포에도 있다.</b> 막으로 싸인 소기관은 없어도 라이보솜은 있다. 단백질은 모든 세포에 필요하기 때문이다."],
       ["자주 하는 실수","막이 없으므로 '막으로 둘러싸인 세포소기관'을 묻는 문제의 답이 될 수 없다."]],
    adv:"마이토콘드리아와 엽록체 안에도 라이보솜이 따로 들어 있다. 그 크기가 원핵세포의 라이보솜과 비슷하다는 점이 세포내 공생설의 근거가 된다."},

  golgi:{n:"골지체",c:"#3F9EA6",p:0,a:1,l:1,m:"단일막",r:"가공과 포장, 배송 센터",
    d:[["구조","납작한 주머니가 여러 겹 <b>쌓여 있는</b> 구조. 주위에 작은 소낭이 많다."],
       ["기능","소포체에서 온 단백질을 <b>가공하고 농축해 소낭에 포장</b>한 뒤 목적지로 보낸다."],
       ["소포체와의 차이","소포체는 그물처럼 이어져 있고 핵막과 연결된다. 골지체는 <b>주머니가 쌓인 더미</b>다."],
       ["발달한 세포","소화 효소를 내보내는 이자, 침샘처럼 <b>분비 작용이 활발한 세포</b>"],
       ["어디에 있나","동물세포와 식물세포 모두"]],
    adv:"라이소솜은 골지체에서 떨어져 나온 소낭이다. 골지체가 만든 것 중 하나가 라이소솜인 셈이다."},

  mito:{n:"마이토콘드리아",c:"#86273A",p:0,a:1,l:1,m:"이중막",r:"세포호흡으로 ATP를 만드는 곳",
    d:[["구조","<b>이중막</b>. 내막이 안쪽으로 접혀 <b>크리스타</b>를 이루고, 내막 안쪽 공간이 <b>바탕질</b>이다."],
       ["기능","<b>세포호흡</b>이 일어나는 곳. 포도당이 분해되어 생긴 물질을 산화하여 <b>ATP를 대량으로</b> 만든다."],
       ["크리스타가 있는 이유","내막이 접히면 <b>표면적이 넓어져</b> ATP를 만드는 효소가 더 많이 자리 잡을 수 있다."],

function yn(v,t){ return v===1?["있음","y"]:v===2?[t||"조건부","b"]:["없음","n"]; }
function showOrg(id){
  if(!id){ $("#info").innerHTML=`<p class="hint">도식에서 <b>세포소기관이나 그 이름표</b>를 누르면 구조와 기능이 여기에 나타납니다.</p>`; return; }
  const P=PART[id];
  if(P){
    let h=`<div class="ph"><span class="swatch" style="background:${P.c}"></span>${P.n}</div>`;
    h+=`<div class="tags"><span class="tg">${P.of}의 세부 구조</span>${P.m?`<span class="tg b">${P.m}</span>`:""}</div>`;
    h+=`<dl>`+P.d.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")+`</dl>`;
    $("#info").innerHTML=h; return;
  }
  const o=ORG[id]; if(!o) return;
  let h=`<div class="ph"><span class="swatch" style="background:${o.c}"></span>${o.n}</div>`;
  if(o.r) h+=`<div style="font-size:12.5px;color:var(--ink3);margin-bottom:9px">${o.r}</div>`;
  const [pt,pc]=yn(o.p,o.pt),[at,ac]=yn(o.a,o.at),[lt,lc]=yn(o.l,o.lt);
  h+=`<div class="tags"><span class="tg ${pc}">원핵세포 ${pt}</span><span class="tg ${ac}">동물세포 ${at}</span><span class="tg ${lc}">식물세포 ${lt}</span></div>`;
  if(o.m) h+=`<div class="tags"><span class="tg mem">막 구조: ${o.m}</span></div>`;

function bindHots(root){
  root.querySelectorAll(".hot").forEach(g=>{
    const act=()=>{
      const id=g.dataset.o;
      root.querySelectorAll(".hot.sel").forEach(x=>x.classList.remove("sel"));
      root.querySelectorAll(`.hot[data-o="${id}"]`).forEach(x=>x.classList.add("sel"));
      const f=VIEW[state.view] && VIEW[state.view].onPick;
      if(f && f(id)===false) return;
      showOrg(id);
      if(VIEW[state.view] && VIEW[state.view].quiz) quizFor(id);
    };
    g.addEventListener("click",e=>{ e.stopPropagation(); act(); });
    g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();act();} });
  });
}

let quizState={bank:null,title:"",cur:-1};
function renderQuiz(i){
  const bank=quizState.bank, q=bank[i]; quizState.cur=i;
  $("#quiz").innerHTML=`<div class="q">${q.q}</div><div class="qopts">`+
    q.o.map((t,k)=>`<button class="qopt" data-i="${k}">${t}</button>`).join("")+`</div><div class="qfb" id="qfb"></div>`+
    (bank.length>1?`<button class="btn qnext" id="qNext">다른 문제</button>`:"");
  let tries=0;
  $("#quiz").querySelectorAll(".qopt").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.i, fb=$("#qfb");
    tries++;
    if(k!==q.a){
      // 틀리면 고른 보기만 표시하고 정답은 알려 주지 않는다. 다시 고를 수 있다.
      b.classList.add("no"); b.disabled=true;
      fb.innerHTML=`<b style="color:#8c3226">다시 생각해 보세요.</b> 도식에서 관련된 구조를 눌러 설명을 확인한 뒤 다시 골라 보세요.`;
      fb.classList.add("show");
      return;
    }
    $("#quiz").querySelectorAll(".qopt").forEach(x=>x.disabled=true);
    b.classList.add("ok");
    fb.innerHTML=`<b style="color:#2f5b28">${tries===1?"정답입니다.":tries+"번 만에 맞혔습니다."}</b> `+q.e;
    fb.classList.add("show");

  const nx=$("#qNext"); if(nx) nx.onclick=()=>nextQuiz();
}
function pickOther(cands){
  // 지금 문항과 다른 것을 무작위로
  const pool=cands.filter(i=>i!==quizState.cur);
  const use=pool.length?pool:cands;
  return use[Math.floor(Math.random()*use.length)];
}
function nextQuiz(){ const b=quizState.bank; if(b) renderQuiz(pickOther(b.map((_,i)=>i))); }
function setQuiz(bank,title){
  const p=$("#quizPanel");
  if(!bank||!bank.length){ p.hidden=true; quizState.bank=null; return; }
  quizState.bank=bank; quizState.title=title||"확인 질문"; quizState.cur=-1;
  p.hidden=false; $("#quizTitle").textContent=quizState.title;
  nextQuiz();
}
/* 도식에서 구조를 누르면 그 구조에 관한 문항으로 바꾼다 */
function quizFor(id){
  const b=quizState.bank; if(!b||!id) return;
  const cands=b.map((q,i)=>(q.t||[]).includes(id)?i:-1).filter(i=>i>=0);
  if(!cands.length) return;
  if(cands.length===1 && cands[0]===quizState.cur) return;
  $("#quizTitle").textContent=quizState.title;
  renderQuiz(pickOther(cands));
}

/* 찾기 모드: 학생이 이름을 보고 도식에서 직접 찾아 누른다 */
function makeFinder(list,label){
  const F={on:false,queue:[],cur:null,ok:0,miss:0};
  function paint(){
    if(!F.on) return;
    $("#quizPanel").hidden=false; $("#quizTitle").textContent="찾기 모드";
    const B=$("#quiz");
    if(!F.cur){
      B.innerHTML=`<div class="q">${label} 세포소기관 ${list.length}개를 모두 찾았습니다.</div>
        <p class="hint" style="margin-bottom:10px">맞힘 ${F.ok}개 / 틀림 ${F.miss}개</p>
        <button class="btn primary" id="fnAgain">다시 하기</button>`;
      $("#fnAgain").onclick=start; return;
    }
    B.innerHTML=`<div class="q">도식에서 <span style="color:var(--orange)">${ORG[F.cur].n}</span>을(를) 찾아 누르세요.</div>
      <p class="hint">남은 개수 ${F.queue.length+1}개, 맞힘 ${F.ok}, 틀림 ${F.miss}</p>
      <div class="qfb show" id="fnFb"></div>`;
  }
  function start(){ F.queue=list.slice().sort(()=>Math.random()-.5); F.ok=0; F.miss=0; F.cur=F.queue.shift(); paint(); }
  function check(id){
    if(!F.on||!F.cur) return true;
    const fb=$("#fnFb");
    if(id===F.cur){
      F.ok++;
      if(fb) fb.innerHTML=`<b style="color:#2f5b28">정답입니다.</b> ${ORG[F.cur].n}: ${ORG[F.cur].r}`;
      setTimeout(()=>{ F.cur=F.queue.length?F.queue.shift():null; paint(); },900);
    } else {
      F.miss++;
      const nm=(ORG[id]||PART[id]||{n:"그것"}).n;
      if(fb) fb.innerHTML=`<b style="color:#8c3226">${nm}은(는) 아닙니다.</b> 다시 찾아보세요.`;
    }
    return false;
  }
  return {start,check,toggle(on){ F.on=on; if(on) start(); }};
}
/* 동물·식물세포 탭의 공통 조작: 찾기 모드, 이름표 가리기 */
function wireCellTab(key,svg,lblId,find,label){
  const fn=makeFinder(find,label);
  VIEW[key].onPick=id=>fn.check(id);
  const fb=$("#fFind"), lb=$("#fLbl");
  fb.onclick=()=>{
    const on=fb.getAttribute("aria-pressed")!=="true";
    fb.setAttribute("aria-pressed",on); fb.textContent=on?"찾기 모드 끝내기":"찾기 모드 시작";
    svg.querySelector("#"+lblId).classList.toggle("hide",on);   // 이름표가 보이면 답이 노출된다
    lb.setAttribute("aria-pressed",on); lb.textContent=on?"이름표 보이기":"이름표 가리기"; lb.disabled=on;
    fn.toggle(on);
    if(!on){ setQuiz(VIEW[key].quiz,"확인 질문"); showOrg(null); }
  };
  lb.onclick=()=>{
    const on=lb.getAttribute("aria-pressed")!=="true";
    lb.setAttribute("aria-pressed",on); lb.textContent=on?"이름표 보이기":"이름표 가리기";
    svg.querySelector("#"+lblId).classList.toggle("hide",on);
  };
}
function highlight(svg,onIds,allIds,on){
  allIds.forEach(id=>{ const e=svg.querySelector("#"+id); if(!e) return;
    e.classList.remove("pulse","soft");
    if(on) e.classList.add(onIds.includes(id)?"pulse":"soft"); });
}

     e:"마이토콘드리아와 골지체는 <b>두 세포 모두</b> 가지고 있으므로 구별의 근거가 되지 못합니다. 공통점으로는 아무것도 판정할 수 없습니다."},

     e:"<b>마이토콘드리아</b>는 두 세포 모두에 있습니다. 엽록체와 세포벽은 식물세포에만, 중심체는 동물세포에만 있습니다."},
    {t:["chloro"],q:"동물세포와 식물세포 중 하나인 세포에서 <b>엽록체</b>가 관찰되었다. 이 세포는?",o:["식물세포","동물세포","알 수 없다","원핵세포"],a:0,
     e:"엽록체는 식물세포에만 있으므로 <b>식물세포</b>입니다. 한쪽에만 있는 구조가 판정의 근거가 됩니다."},
    {t:["wall", "memb"],q:"동물세포에 세포벽이 없어서 나타나는 특징은?",o:["물이 지나치게 많이 들어오면 터질 수 있다","광합성을 할 수 없다","단백질을 합성할 수 없다","세포호흡을 할 수 없다"],a:0,
     e:"세포벽이 버텨 주지 않아 물이 지나치게 들어오면 <b>터질 수 있습니다</b>. 광합성을 못 하는 것은 엽록체가 없기 때문입니다."},
    {t:["chloro", "mito", "wall"],q:"식물세포에 대한 설명으로 옳은 것은?",o:["엽록체와 마이토콘드리아를 모두 가진다","중심체가 있다","세포벽이 물질을 선택적으로 통과시킨다","핵이 없다"],a:0,
     e:"식물세포는 <b>엽록체와 마이토콘드리아를 모두</b> 가집니다. 세포벽은 전투과성이고, 선택적 투과성을 가진 것은 세포막입니다."}
  ],
  init(svg){
    const A={memb:"a-memb",nucleus:"a-nuc",rer:"a-rer",ser:"a-ser",ribo:"a-ribo",golgi:"a-golgi",mito:"a-mito",skel:"a-skel",cent:"a-cent",lyso:"a-lyso"};
    const L={memb:"p-memb",nucleus:"p-nuc",rer:"p-rer",ser:"p-ser",ribo:"p-ribo",golgi:"p-golgi",mito:"p-mito",skel:"p-skel",wall:"p-wall",chloro:"p-chloro",vac:"p-vac"};
    const SAME=["memb","nucleus","rer","ser","ribo","golgi","mito","skel"];
    const ALL=[...Object.values(A),...Object.values(L),"a-inset"];
    const MODE={
      all:{on:[],t:"",s:""},
      same:{on:[...SAME.map(k=>A[k]),...SAME.map(k=>L[k])],
        t:"공통점: 세포막, 핵, 소포체, 라이보솜, 골지체, 마이토콘드리아, 세포골격",
        s:"두 세포가 가진 것의 대부분은 같다. 특히 마이토콘드리아는 식물세포에도 반드시 있다."},
      an:{on:[A.cent,A.lyso],t:"동물세포에만: 중심체, 발달한 라이소솜",
        s:"중심체는 방추사를 만들고, 라이소솜은 세포내 소화를 한다. 식물세포는 라이소솜 역할을 액포가 대신한다."},
      pl:{on:[L.wall,L.chloro,L.vac],t:"식물세포에만: 세포벽, 엽록체, 크게 발달한 액포",
        s:"동물세포와 식물세포 중에서는 이 셋 중 하나라도 보이면 식물세포다."}
    };
    function set(m){
      highlight(svg,MODE[m].on,ALL,m!=="all");
      svg.querySelector("#cmpBan").classList.toggle("hide",m==="all");
      svg.querySelector("#cmpBt").textContent=MODE[m].t;
      svg.querySelector("#cmpBs").textContent=MODE[m].s;
      $$("#cmpF button").forEach(b=>b.setAttribute("aria-selected",b.dataset.f===m));
    }
    $$("#cmpF button").forEach(b=>b.onclick=()=>set(b.dataset.f));
    $("#cmpTbl").onclick=()=>summary("동물세포와 식물세포 비교표","포함 여부와 하는 일",[],CMP_TABLE);
    $("#cmpSum").onclick=()=>summary("동물세포와 식물세포","핵심 정리",[
      "<b>같은 것</b>: 세포막, 핵, 소포체, 라이보솜, 골지체, 마이토콘드리아, 세포골격. 대부분이 같다.",
      "<b>식물세포에만</b>: <b>세포벽</b>, <b>엽록체</b>, <b>크게 발달한 액포</b>",
      "<b>동물세포에만</b>: <b>중심체</b>, <b>발달한 라이소솜</b>",
      "가장 흔한 오해는 <b>식물세포에 마이토콘드리아가 없다</b>고 생각하는 것이다. 식물도 세포호흡을 하므로 반드시 있다.",
      "동물세포와 식물세포를 구별할 때는 <b>세포벽, 엽록체, 큰 액포</b>가 보이는지부터 확인하는 것이 가장 빠르다.",
      "공통으로 가진 소기관(마이토콘드리아, 골지체 등)으로는 <b>아무것도 판정할 수 없다</b>."
    ],CMP_TABLE);
    set("all");
  }
};

/* ============================================================
   세포 구별하기 (탐구)
   ============================================================ */
const IDQ=[
  {n:"세포 A",a:2,box:[18,108,356,330],on:["p-wall","p-chloro","p-vac"],abs:[],
   e:"<b>식물세포</b>입니다. 핵이 있으므로 원핵세포가 아니고, <b>세포벽, 엽록체, 큰 액포</b>가 있으므로 식물세포입니다."},
  {n:"세포 B",a:1,box:[392,92,398,380],on:["a-cent","a-lyso"],abs:["iBAbs"],
   e:"<b>동물세포</b>입니다. 핵이 있으므로 진핵세포이고, <b>세포벽과 엽록체가 없으며 중심체가 있으므로</b> 동물세포입니다. 마이토콘드리아는 식물세포에도 있어 판정의 근거가 되지 못합니다."},
  {n:"세포 C",a:0,box:[836,176,250,236],on:["k-dna"],abs:["iCAbs"],
   e:"<b>원핵세포</b>입니다. 세포벽이 있지만 <b>핵막으로 싸인 핵이 없고</b> 막으로 싸인 소기관도 없습니다. 세포벽만 보고 식물세포라 답하지 않도록 주의해야 합니다."}
];
VIEW["eu-id"]={
  title:"세포 구별하기",
  sub:"세 세포를 관찰하고 각각 어떤 세포인지 판정해 보세요",
  noclick:true,
  legend:["wall","nucleus","chloro","vac","cent","lyso","mito",["유전물질","#4F6FA8"]],
  quizTitle:"탐구 문제",
  ctrl:`<button class="btn primary" id="idStart">처음부터</button><button class="btn" id="idClue">단서 보기</button>
        <span class="spacer"></span><button class="btn" id="idSum">판정 요령</button>`,
  init(svg){
    let i=0, clue=false;
    const ALLON=["p-wall","p-chloro","p-vac","a-cent","a-lyso","k-dna"];
    function mark(k,ok){ const e=svg.querySelector("#m"+k); e.textContent=ok?"○":"✕"; e.setAttribute("fill",ok?"#3d8b3d":"#C0392B"); }
    function showClue(on){
      ALLON.forEach(id=>svg.querySelector("#"+id).classList.remove("pulse"));
      ["iBAbs","iCAbs"].forEach(id=>svg.querySelector("#"+id).classList.add("hide"));
      clue=on; $("#idClue").setAttribute("aria-pressed",on);
      if(!on||i>=IDQ.length) return;
      // 지금 판정 중인 세포의 단서만 보여 준다. 있는 것은 깜박이고, 없는 것은 점선과 ✕로 표시한다.
      IDQ[i].on.forEach(id=>svg.querySelector("#"+id).classList.add("pulse"));
      IDQ[i].abs.forEach(id=>svg.querySelector("#"+id).classList.remove("hide"));
    }
    function render(){
      const S=svg.querySelector("#idSel"), R=svg.querySelector("#idSelR");
      showClue(false);
      if(i<IDQ.length){
        S.classList.remove("hide");
        const [x,y,w,h]=IDQ[i].box;
        R.setAttribute("x",x);R.setAttribute("y",y);R.setAttribute("width",w);R.setAttribute("height",h);
      } else S.classList.add("hide");
      $("#quizPanel").hidden=false; $("#quizTitle").textContent="탐구 문제";
      if(i>=IDQ.length){
        $("#quiz").innerHTML=`<div class="q">세 세포를 모두 판정했습니다.</div>
          <p class="hint" style="margin-bottom:10px">판정의 순서를 기억해 두세요. ① 핵막이 있는가 → ② 세포벽과 엽록체가 있는가</p>
          <button class="btn primary" id="idAgain">다시 하기</button>`;
        $("#idAgain").onclick=()=>{ i=0; ["A","B","C"].forEach(k=>svg.querySelector("#m"+k).textContent=""); render(); };
        return;
      }
      const q=IDQ[i];
      $("#quiz").innerHTML=`<div class="q">${q.n}는 어떤 세포일까요?</div>
        <div class="qopts">${["원핵세포","동물세포","식물세포"].map((t,k)=>`<button class="qopt" data-i="${k}">${t}</button>`).join("")}</div>
        <div class="qfb" id="qfb"></div>`;
      let tries=0;
      $("#quiz").querySelectorAll(".qopt").forEach(b=>b.onclick=()=>{
        const k=+b.dataset.i, fb=$("#qfb");
        tries++;
        if(k!==q.a){
          // 틀리면 정답을 알려 주지 않고 다시 고르게 한다. 단서 보기를 권한다.
          b.classList.add("no"); b.disabled=true;
          fb.innerHTML=`<b style="color:#8c3226">다시 생각해 보세요.</b> 핵막이 있는지부터 확인하고, 막히면 <b>단서 보기</b>를 눌러 보세요.`;
          fb.classList.add("show");
          return;
        }
        $("#quiz").querySelectorAll(".qopt").forEach(x=>x.disabled=true);
        b.classList.add("ok");
        mark(["A","B","C"][i],tries===1);   // 한 번에 맞혔을 때만 ○
        fb.innerHTML=`<b style="color:#2f5b28">${tries===1?"정답입니다.":tries+"번 만에 맞혔습니다."}</b> `+q.e+
          `<br><br><button class="btn primary" id="idNext">${i<IDQ.length-1?"다음 세포":"마치기"}</button>`;
        fb.classList.add("show");
        $("#idNext").onclick=()=>{ i++; render(); };
      });
    }
    $("#idStart").onclick=()=>{ i=0; ["A","B","C"].forEach(k=>svg.querySelector("#m"+k).textContent=""); render(); };
    $("#idClue").onclick=()=>showClue(!clue);
    $("#idSum").onclick=()=>summary("세포를 판정하는 순서","무엇부터 확인해야 할까",[
      "<b>① 핵막으로 싸인 핵이 있는가?</b> 없으면 <b>원핵세포</b>다. 여기서 이미 갈린다.",
      "<b>② 핵이 있다면 진핵세포다.</b> 동물세포와 식물세포 중에서는 세포벽, 엽록체, 큰 액포 중 하나라도 있으면 <b>식물세포</b>다.",
      "<b>③ 세포벽도 엽록체도 없고 중심체가 보이면 <b>동물세포</b>다.",
      "<b>함정 1</b>: 세포벽이 있다고 무조건 식물세포가 아니다. <b>원핵세포에도 세포벽이 있다.</b> 핵막부터 확인해야 하는 이유다.",
      "<b>함정 2</b>: 마이토콘드리아가 보인다고 동물세포가 아니다. <b>식물세포에도 있다.</b>",
      "<b>함정 3</b>: 라이보솜이 보인다고 진핵세포가 아니다. <b>원핵세포에도 있다.</b>",
      "판정에 쓸 수 있는 것은 <b>어느 한쪽에만 있는 것</b>뿐이다. 공통점으로는 아무것도 가릴 수 없다."
    ]);
    render();
  }
};

/* ---------- 시작 ---------- */
go("pk-cmp");

</script>
</body>
</html>
